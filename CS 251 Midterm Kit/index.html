% =====================================================================
\section{0 \quad Conventions \& Math Toolkit}
\begin{itemize}
\item \textbf{Height = number of edges} on the longest root-to-leaf path. Single node: $h=0$. Empty: $h=-1$.
\item Heap arrays are \textbf{0-indexed}. BST insert sends \textbf{equal keys left}. BST delete uses the \textbf{successor}.
\item B-tree \textbf{order $m$} (Knuth) = max children. PSO 5 uses \textbf{minimum degree $t$} (CLRS).
\end{itemize}

\subsection{Sums you need}
\begin{align*}
\sum_{i=1}^{n} i &= \frac{n(n+1)}{2} \in \Th(n^2)
&\sum_{i=0}^{h} 2^i &= 2^{h+1}-1\\
\sum_{i=0}^{\infty} \frac{1}{2^i} &= 2
&\sum_{i=1}^{\infty} \frac{i}{2^i} &= 2 \quad(\text{a constant!})\\
\sum_{i=1}^{n} \log i &= \log(n!) \in \Th(n\log n)
&\log_b n &= \frac{\log_2 n}{\log_2 b}
\end{align*}
\textcolor{trapc}{\textbf{Trap:}} a geometric (or $\frac{i}{2^i}$-weighted) sum \textbf{converges to a constant}. It never produces a $\log n$ factor.

\subsection{Asymptotic bounds}
\[
O = \text{upper bound } (\le) \qquad \Omega = \text{lower bound } (\ge) \qquad \Th = \text{both}
\]
\[
n\log n \in O(n^2)\ \text{is TRUE} \qquad\qquad \Th(n\log n) \ne \Th(n^2)
\]

\begin{keyb}{Necessarily true / Possibly true / Necessarily false}
\begin{enumerate}[label=\textbf{\arabic*.}]
\item Does the claim depend on the \textbf{input} or a \textbf{parameter} ($k$, $m$, order, shape)? Find one YES case and one NO case $\Rightarrow$ \textbf{Possibly true}.
\item It can \textbf{never fail} (definition, theorem, or $O(\text{something bigger})$) $\Rightarrow$ \textbf{Necessarily true}.
\item It can \textbf{never hold} (contradicts a theorem or definition) $\Rightarrow$ \textbf{Necessarily false}.
\end{enumerate}
\textbf{Examples:} HeapSort is $O(n^2)$: \textbf{N.T.} \ HeapSort is $\Th(n^2)$: \textbf{N.F.} \ Counting sort is $O(n)$: \textbf{P.T.} \ BST search is $O(\log n)$: \textbf{P.T.} \ B-tree height is $O(\log n)$: \textbf{N.T.} \ Comparison sort in $O(n)$ worst case: \textbf{N.F.}\\[2pt]
\textbf{How to justify:}
\textbf{False:} ``Counterexample: input \dots\ produces \dots''\\
\textbf{Necessarily true:} ``By the definition / theorem \dots, this holds for every input.''\\
\textbf{Possibly true:} ``True when \dots\ (example), false when \dots\ (example).''\\
\textbf{Runtime:} ``Loop 1 is $O(\cdot)$; loop 2 runs $\sum\dots$ times in total; so $O(\cdot)$.''
\end{keyb}

\begin{howto}{analyze a brand-new algorithm (Part A T/F)}
\begin{enumerate}[label=\arabic*.]
\item Cost each loop separately.
\item \textbf{Nested-loop trap:} add up the inner loop's \emph{total} iterations over all outer iterations. If the inner loop runs $C[v]$ times, then $\sum_v C[v]=n$, so the total is $O(n+k)$, \textbf{not} $O(nk)$.
\item Any extra array or list of size $n$ or $k$ $\Rightarrow$ \textbf{not in place}.
\item Stable? Follow two equal keys. Does it move records, or just rewrite values from counts (losing payloads)?
\item ``Best scenario'' = small key range $k$ and large $n$.
\end{enumerate}
\end{howto}

% =====================================================================
\section{1 \quad Binary Heap}
\textbf{Definition.} A \textbf{complete} binary tree (every level full except the last, which fills left $\to$ right) with \textbf{heap order}:
\begin{itemize}
\item \textbf{Min-heap:} parent $\le$ each child. \quad \textbf{Max-heap:} parent $\ge$ each child.
\item Siblings are \textbf{unordered}. A heap is \textbf{not} a BST, and its array is \textbf{not} sorted.
\item Priority-queue ADT: \texttt{Insert}, \texttt{Extract/Delete Min/Max}, \texttt{Peek}, \texttt{IsEmpty}, \texttt{Size}.
\end{itemize}

\subsection{Array formulas (root at index 0)}
\begin{keyb}{Index math}
\vspace{-6pt}
\begin{align*}
\text{left}(i) &= 2i+1 & \text{right}(i) &= 2i+2\\[2pt]
\text{parent}(i) &= \fl{\frac{i-1}{2}} & \text{last internal} &= \fl{\frac n2}-1\\[2pt]
\text{leaves} &: \fl{\frac n2}\ \text{to}\ n-1 & \#\text{leaves} &= \cl{\frac n2}\\[2pt]
\text{height } h &= \fl{\log_2 n} & 2^h \le\ &n \le 2^{h+1}-1
\end{align*}
\end{keyb}
\textbf{Example:} $i=23$: left $=47$, right $=48$, parent $=11$. \quad $n=99$: last internal $=48$, and $64 \le 99 \le 127 \Rightarrow h=6$.

\subsection{Code (min-heap; for a max-heap flip every comparison)}
\begin{code}
SiftUp(A, i):
  while i > 0 and A[parent(i)] > A[i]:     // child smaller -> swap
    swap(A, i, parent(i));  i <- parent(i)

Insert(x):
  if n = capacity: A <- Resize(A, 2*capacity)   // amortized O(1)
  A[n] <- x;  n <- n + 1;  SiftUp(A, n - 1)

MinChildIndex(A, n, i):
  lc <- 2i + 1;  if lc >= n: return n      // no children
  rc <- 2i + 2;  if rc >= n: return lc     // only a left child
  if A[lc] < A[rc]: return lc  else: return rc   // TIE -> RIGHT

SiftDown(A, n, i):
  m <- MinChildIndex(A, n, i)
  while m < n and A[i] > A[m]:
    swap(A, i, m);  i <- m;  m <- MinChildIndex(A, n, i)

ExtractMin():
  if n = 0: throw EmptyHeap
  t <- A[0];  A[0] <- A[n-1]
  SiftDown(A, n - 1, 0);  n <- n - 1;  return t
\end{code}
\begin{trap}[: slide typo]
The slide prints \texttt{A[p] < A[i]} in the \emph{min}-heap SiftUp. That is the \textbf{max}-heap comparison. Reason from the rule, not the symbol.
\end{trap}

\subsection{Facts that become trick questions}
\begin{itemize}
\item The \textbf{max of a min-heap is a leaf} (could be any leaf).
\item Distinct keys: the 2nd smallest is a \textbf{child of the root}; the 3rd smallest is at depth 1 or 2; the $k$-th smallest is at depth $\le k-1$.
\item A sorted ascending array \textbf{is} a min-heap. A min-heap array is only \emph{possibly} sorted.
\item \textbf{Number of places a new item can end up} $= h+1$, where $h$ is the height \emph{after} inserting. ($n=99 \to 100$ nodes, $h=6$, answer 7.)
\end{itemize}

\begin{howto}{heap trace questions}
\textbf{Insert:} put at index $n$; compare with parent $\fl{\frac{i-1}{2}}$; swap while order is violated. Write the array after \emph{every} insert.\\[1pt]
\textbf{Extract:} save root; move last item to root; shrink; swap with the \textbf{smaller} child (min) or \textbf{larger} child (max) until it fits.\\[1pt]
\textbf{Is it a heap?} For each $i \le \fl{n/2}-1$ compare $A[i]$ with $A[2i+1]$ and $A[2i+2]$.
Example: $[10,20,15,30,40,50,12]$: $A[2]=15 > A[6]=12$, so \textbf{not} a heap.\\[1pt]
\textbf{Traversal of a heap:} draw the tree level by level from the array, then traverse. PSO 3: max-heap inserts $8,11,3,10,7,4,12 \to [12,10,11,8,7,3,4]$, in-order $8,10,7,12,3,11,4$.
\end{howto}

\section{2 \quad Heapify (build a heap in place)}
\begin{code}
Heapify(A):
  n <- size of A
  for i from floor(n/2) - 1 down to 0:
    SiftDown(A, n, i)          // leaves are already heaps
\end{code}
\begin{itemize}
\item Bottom-up, in place, \textbf{$\Th(n)$}.
\item Number of SiftDown calls $= \fl{n/2}$. First index $= \fl{n/2}-1$ \ (e.g.\ $n=13 \to 5$).
\item Max swaps in one SiftDown from the root $= h$.
\end{itemize}

\begin{keyb}{Why Heapify is $O(n)$}
At most $\cl{n/2^{h+1}}$ nodes have height $h$, and each does $O(h)$ work:
\[
\sum_{h=0}^{\fl{\log_2 n}} \frac{n}{2^{h+1}}\cdot h
\;=\; \frac n2 \sum_{h\ge 0}\frac{h}{2^h}
\;=\; \frac n2 \cdot 2 \;=\; n \;\in O(n)
\]
\end{keyb}

\subsection{Worked example: max-heapify $[4,6,3,5,7,1]$ \quad ($n=6$, $i=2,1,0$)}
\begin{tabularx}{\linewidth}{@{}clY@{}}
\toprule
$i$ & \textbf{Array after} & \textbf{What happened}\\\midrule
2 & $[4,6,3,5,7,1]$ & 3 vs child 1: no swap\\
1 & $[4,7,3,5,6,1]$ & 6 vs 5, 7: swap with 7\\
0 & $[7,6,3,5,4,1]$ & 4 $\leftrightarrow$ 7, then 4 $\leftrightarrow$ 6 (keep sinking!)\\\bottomrule
\end{tabularx}
\begin{trap}[: Heapify $\ne$ inserting one by one]
Inserting 4, 6, 3, 5, 7, 1 into a max-heap gives $[7,6,3,4,5,1]$, but Heapify gives $[7,6,3,5,4,1]$. Both are valid. ``Same result'' is only \textbf{possibly} true.
\end{trap}

\section{3 \quad HeapSort}
\begin{code}
HeapSort(A):
  n <- size of A
  Heapify(A)                   // MAX-heap for ascending order
  for i from n-1 down to 1:
    swap(A, 0, i)              // current max -> its final slot
    n <- n - 1                 // shrink heap: protects sorted part
    SiftDown(A, n, 0)          // MaxChildIndex; swap if A[i] < A[m]
\end{code}
\begin{itemize}
\item Ascending $\Rightarrow$ \textbf{max}-heap. Descending $\Rightarrow$ min-heap.
\item The array is always \textbf{[ heap $\mid$ sorted suffix ]}.
\end{itemize}
\[
T(n) = \underbrace{O(n)}_{\text{Heapify}} + \underbrace{(n-1)\cdot O(\log n)}_{\text{sort-down}} = O(n\log n)
\]
\begin{tabularx}{\linewidth}{@{}Yl@{}}
\toprule
Worst / average time & $O(n\log n)$\\
All keys equal & $\Th(n)$ \ (SiftDown stops immediately)\\
Extra space & $\Th(1)$ \ (in place)\\
Stable & \textbf{No}\\
In practice & poor cache behaviour\\\bottomrule
\end{tabularx}

\subsection{Variants from the PSOs / tests}
\begin{itemize}
\item \textbf{PSO 4 bags:} $n/k$ bags of $k$. HeapSort each ($O(n\log k)$), merge pairwise ($O(n\log\frac nk)$): total $O(n\log n)$.
\item \textbf{MinHeapSort} (insert all into heap $H$, extract into $B$): $O(n\log n)$ time, $\Th(n)$ extra space, not stable. Using Heapify instead of inserts does \textbf{not} improve the worst case, because the $n$ extractions are still $\Th(n\log n)$.
\item \textbf{$k$-sorted array} (each item at most $k$ from its final slot): keep a min-heap of $k+1$ items $\Rightarrow O(n\log k)$ time, $\Th(k)$ space. No contradiction with the lower bound: only $\le (2k+1)^n$ inputs are possible.
\end{itemize}

\section{4 \quad Sorting Fundamentals}
\textbf{Four things to analyze:} correctness, running time (\# compares and swaps), \textbf{stability}, space (\textbf{in place} = $O(1)$ extra).

\textbf{Stable:} equal keys keep their input order. Stability is what makes radix sort work.

\subsection{Decision-tree lower bound}
A tree of height $h$ has at most $2^h$ leaves, and it needs at least $n!$ leaves:
\begin{align*}
2^h \ge n! \;\Rightarrow\; h &\ge \log_2(n!) = \sum_{i=1}^{n}\log_2 i\\
&\ge \sum_{i=n/2}^{n}\log_2 i \;\ge\; \frac n2\log_2\frac n2 \;\in\; \Omega(n\log n)
\end{align*}
\begin{keyb}{Theorem}
Every \textbf{comparison} sort needs $\Omega(n\log n)$ comparisons in the \textbf{worst case}. HeapSort and MergeSort are optimal.\\
Smallest possible worst case $=\cl{\log_2 n!}$: \quad $n=3{:}\ 3$ \quad $n=4{:}\ 5$ \quad $n=5{:}\ 7$ \quad $n=6{:}\ 10$.
\end{keyb}
\textbf{Ways around it:} non-comparison sorts (counting, bucket, pigeonhole, radix) use keys as indices. Restricted inputs (e.g.\ $k$-sorted) have fewer possible permutations.

\rowcolor{rowbg}MergeSort & $\Th(n\log n)$ & $\Th(n)$ & Yes & Yes\\

\begin{howto}{pick the right sort}
\begin{itemize}
\item Small integer range ($k \in O(n)$), needs stability $\to$ \textbf{counting sort}.
\item Huge range, few items (e.g.\ IDs up to $10^9$) $\to$ \textbf{merge / heap / quick}.
\item Uniform reals in $[0,1)$ $\to$ \textbf{bucket sort}. \ Fixed number of digits $\to$ \textbf{radix}.
\item $O(1)$ extra space + guaranteed $n\log n$ $\to$ \textbf{heap}. \ Stable comparison sort $\to$ \textbf{merge}.
\end{itemize}
\end{howto}

\section{5 \quad Counting Sort}
\textbf{Requirement:} keys are \textbf{integers in $[0,k]$}.
\begin{code}
CountingSort(A, k):
  C <- array of k+1 zeros                // O(k)
  for i from 0 to n-1:  C[A[i]]++        // O(n)  C[v] = # equal to v
  for i from 1 to k:    C[i] += C[i-1]   // O(k)  C[v] = # <= v
  B <- array of size n
  for i from n-1 DOWNTO 0:               // O(n)  BACKWARDS = stable
    B[C[A[i]] - 1] <- A[i]
    C[A[i]] <- C[A[i]] - 1
  return B                               // optional: copy B into A
\end{code}
\[ \text{Time } \Th(n+k) \qquad \text{Space } \Th(n+k) \qquad \text{Stable} \qquad \text{Not in place} \]
\textbf{It is $O(n)$ only when $k \in O(n)$.}
After prefix sums, $C[v]$ is one past the last slot for $v$. After placement, $C[v]$ is the first slot of $v$'s block.

$A=[(3,a),(1,b),(3,c)]$, prefix $C=[0,1,1,3]$.\\
Forward: $(3,a)\to B[2]$, $(1,b)\to B[0]$, $(3,c)\to B[1]$ $\Rightarrow (1,b),(3,c),(3,a)$: \textbf{unstable}.\\

\subsection{Offsets, range queries, bad cases}
\textbf{Negative / shifted keys:}
\[ \text{index}(v) = v - \min \qquad \text{array size} = \max - \min + 1 \]
$[-100,20]$: index $= v+100$, size 121. \quad $[-50,30]$: size 81, and $-7 \mapsto 43$.

\textbf{Range query in $O(1)$} after $\Th(n+k)$ prep (prefix sums):
\[ \#\{a \le x \le b\} = C[b]-C[a-1] \quad (\text{or } C[b] \text{ if } a=0) \]
\[ \#\{x \ge a\} = n - C[a-1] \]
\begin{trap}[: check your $k$]
\begin{itemize}
\item 1{,}000 IDs in $[0,10^9]$: a $10^9$-entry array ($\approx$ 4 GB) and $10^9$ steps to zero it, vs.\ $n\log n \approx 10^4$. Use merge / heap / quick.
\item $k$-digit numbers with $k\in\Th(n)$: max value $10^k-1$, so time $O(n+10^n)$, \textbf{exponential}.
\item Keys in $[0,n^2]$: time $\Th(n^2)$, never $O(n)$.
\end{itemize}
\end{trap}
\textbf{TallySort} (rebuild $A$ from counts): $O(n+k)$, \textbf{not} $O(nk)$; loses payloads, so it cannot sort records.

\section{6 \quad Bucket, Pigeonhole \& Radix Sort}
\begin{code}
BucketSort(A, k):                // k buckets
  B <- array of k empty lists
  M <- max(A) + 1
  for i from 0 to n-1:
    j <- floor(k * A[i] / M)     // bucket index 0..k-1
    B[j].insert(A[i])
  for i from 0 to k-1:  sort list B[i]
  return B[0] ++ B[1] ++ ... ++ B[k-1]
\end{code}
\[ j = \fl{\frac{k\cdot A[i]}{M}}, \qquad M = \max(A)+1 \]
Classic version: keys in $[0,1)$, $k=n$, $j=\fl{n\cdot A[i]}$. Correct because $j$ never decreases as the key grows.

\subsection{Trace: $[29,25,3,49,9,37,21,43]$, $k=8$, $M=50$}
\begin{center}
\begin{tabular}{@{}lcccccccc@{}}\toprule
key & 29 & 25 & 3 & 49 & 9 & 37 & 21 & 43\\
$8x/50$ & 4.64 & 4.0 & 0.48 & 7.84 & 1.44 & 5.92 & 3.36 & 6.88\\
bucket & 4 & 4 & 0 & 7 & 1 & 5 & 3 & 6\\\bottomrule
\end{tabular}
\end{center}
Bucket 4 $=[29,25] \to [25,29]$. Result $[3,9,21,25,29,37,43,49]$.

\begin{keyb}{Running time}
\vspace{-4pt}
\begin{align*}
\text{Best:}&\ O(n) \text{ (about one item per bucket)}\\
\text{Average (uniform):}&\ O\!\left(n+\tfrac{n^2}{k}+k\right) \xrightarrow{\ k=n\ } O(n)\\
\text{Worst:}&\ O(n^2) \text{ (all in one bucket + insertion sort)}\\
\text{One \emph{key} per bucket:}&\ O(n+k)
\end{align*}
With heap/merge sort inside the buckets, the worst case drops to $O(n\log n)$.
\end{keyb}
\textbf{Stable} if and only if the inner sort is stable and inserts append. Counting sort = one bucket per value.

\begin{howto}{bucket-index questions}
Compute $\fl{k x / M}$ exactly. Check with multiplication: $5\cdot 55=275 < 276=3\cdot 92$, so $\fl{275/92}=2$. Insert in \textbf{input order}; sort each bucket; concatenate. The max always lands in bucket $k-1$, never $k$.
\end{howto}
\textbf{Words by length in $O(n)$:} 45 lists (longest word), a word of length $l$ goes in list $l-1$, join the 45 lists (a constant).

\subsection{Pigeonhole sort (Problem Set 2)}
$m = \max-\min+1$ holes; append $A[i]$ to hole $H[A[i]-\min]$; read holes in order.
\begin{itemize}
\item Time and space $O(n+m)$, stable, not in place.
\item \textbf{Never $O(n^2)$}: no sorting inside holes; all $n$ in one hole is fine $\Rightarrow$ ``degrades to $n^2$'' is \textbf{N.F.}
\item \textbf{Can waste memory}: $[10,1,1,\dots,1]$. Best: huge $n$, tiny range (500k ints in 1..100). Bad: few items with a huge range; floats.
\end{itemize}

\subsection{Radix sort (LSD)}
Stable counting sort on each digit, least significant first. $d$ digits in base $b$:
\[ T = O\big(d\,(n+b)\big) \]
\textbf{PSO 5} ($m$ integers, 1 to $k$ digits, $k\in\Th(m)$, $n$ total digits, uniform lengths): bucket by digit count ($B[d_i-1]$), radix-sort each bucket, concatenate (fewer digits $\Rightarrow$ smaller).
\[ \sum_{i=0}^{k-1}(i+1)\cdot\frac mk = O(n) \quad\text{since } \tfrac mk \text{ is a constant} \]

\section{7 \quad Binary Search Tree}
\textbf{Definition:} null, or a root with left and right BSTs where \textbf{every} key in the left subtree $\le$ root $<$ \textbf{every} key in the right subtree. \textbf{In-order traversal = sorted.}
\begin{code}
search(r, x):
  if r = null: return null
  if x = r.item: return r
  if x < r.item: return search(r.left, x)
  return search(r.right, x)

insert(r, x):
  if r = null: return new Node(x)
  if x <= r.item: r.left  <- insert(r.left, x)    // equal -> LEFT
  else:           r.right <- insert(r.right, x)
  return r

delete(r, x):
  if r = null: return null
  if x < r.item:   r.left  <- delete(r.left, x)
  elif x > r.item: r.right <- delete(r.right, x)
  else:
    if r.left = null:  return r.right     // 0 or 1 child
    if r.right = null: return r.left
    s <- findmin(r.right)                 // in-order successor
    r.item <- s.item
    r.right <- delete(r.right, s.item)
  return r

findmin(r):  while r.left != null: r <- r.left
             return r

generateBST(A, l, r):                     // A is sorted
  if r < l: return null
  m <- floor((l + r) / 2)
  root <- new Node(A[m])
  root.left  <- generateBST(A, l, m - 1)
  root.right <- generateBST(A, m + 1, r)
  return root
\end{code}

[5,\hl [3 [1 [,phantom] [2]] [4]] [8 [7] [9]]]
\end{forest}\quad$\xrightarrow{\text{delete } 5}$\quad
\begin{forest} hp
[7,\hl [3 [1 [,phantom] [2]] [4]] [8 [,phantom] [9]]]
\end{forest}
\cp{Two children: copy successor 7 (min of right subtree) into the root, then delete leaf 7.}
\end{center}

\subsection{Running time and height}
\begin{tabularx}{\linewidth}{@{}Ycc@{}}
\toprule
& \textbf{Unbalanced (worst)} & \textbf{Balanced}\\\midrule
search / insert / delete one & $O(n)$ & $O(\log n)$\\
insert all $n$ & $O(n^2)$ & $O(n\log n)$\\\bottomrule
\end{tabularx}
\[ \text{Balanced: } \big|h(\text{left})-h(\text{right})\big| \le 1 \text{ at every node} \;\Rightarrow\; h\in O(\log n) \]
\[ h+1 \;\le\; n \;\le\; 2^{h+1}-1 \qquad\Rightarrow\qquad \fl{\log_2 n} \le h \le n-1 \]
Sorted (or reverse-sorted) inserts build a list, $h=n-1$:
\[ \text{total cost} = \sum_{i=1}^{n}(i-1) = \frac{n(n-1)}{2} \in \Th(n^2) \]

\subsection{Facts}
\begin{itemize}
\item The successor of a node with two children (min of right subtree) has \textbf{no left child}.
\item The max node has no right child. Shape depends on insertion order.
\item Inserting a BST's pre-order sequence rebuilds the same tree.
\item Heap vs BST vs B-tree: heap search $O(n)$, BST $O(h)$, B-tree $O(\log n)$. Heaps and BSTs grow at the bottom; B-trees grow at the \textbf{top}.
\end{itemize}
\begin{trap}[: ``search-path'' claim is FALSE (PSO 5)]
\begin{minipage}{0.3\linewidth}\centering
\begin{forest} hp
[1,\hl [,phantom] [3,\hl [2] [4,\hl]]]
\end{forest}
\end{minipage}\hfill
\begin{minipage}{0.66\linewidth}
Search for 4. Left of the path $A=\{2\}$, on the path $B=\{1,3,4\}$, right $C=\emptyset$. The claim $a\le b\le c$ fails because $2 > 1$.
\end{minipage}
\end{trap}

\begin{howto}{BST problem types}
\textbf{Build + height:} insert each key from the root ($\le$ goes left); height = longest path in \emph{edges}. PS 2: $4,2,8,0,1,3 \to h=3$ (4-2-0-1). A balanced BST on 6 keys has $h=\fl{\log_2 6}=2$.\\[1pt]
\textbf{Delete (two children):} successor = go right once, then left until null. Copy it up, delete it from the right subtree (it has at most one child).\\[1pt]
\textbf{Traversals:} pre = N L R, in = L N R, post = L R N, level-order = BFS.\\[1pt]
\textbf{generateBST:} root $=A\big[\fl{(l+r)/2}\big]$, recurse on halves; height $\fl{\log_2 n}$.
\end{howto}

\section{8 \quad B-Tree}
Bayer \& McCreight (1972), for data on disk: 1 node = 1 disk block, so nodes are wide and the tree is shallow. \textbf{Always perfectly balanced}; grows at the \textbf{root}.

\subsection{Rules for order $m$}
\begin{tabularx}{\linewidth}{@{}Yccc@{}}
\toprule
& \textbf{Order $m$} & \textbf{2-3 ($m=3$)} & \textbf{2-3-4 ($m=4$)}\\\midrule
max children & $m$ & 3 & 4\\
\rowcolor{rowbg}max keys & $m-1$ & 2 & 3\\
min children (internal, non-root) & $\cl{m/2}$ & 2 & 2\\
\rowcolor{rowbg}min keys (non-root) & $\cl{m/2}-1$ & 1 & 1\\
root & \multicolumn{3}{c}{$\ge 2$ children unless it is a leaf ($\ge 1$ key)}\\\bottomrule
\end{tabularx}
\begin{itemize}
\item A node with $c$ children has exactly $c-1$ keys, kept sorted.
\item Key $i$ separates child $i$ (smaller keys) from child $i+1$ (larger keys).
\item \textbf{All leaves are at the same depth}; internal nodes have no null children.
\end{itemize}

\subsection{Minimum degree $t$ (PSO 5) and key counts}
Non-root nodes hold $t-1$ to $2t-1$ keys ($t$ to $2t$ children); the root holds $\ge 1$ key. $t=2$ is the 2-3-4 tree.
\begin{keyb}{Keys in a B-tree of height $h$}
\vspace{-6pt}
\begin{align*}
\text{max keys} &= (2t)^{h+1}-1 & \text{min keys} &= 2t^{h}-1\\[2pt]
\text{order } m\text{, max} &= m^{h+1}-1 & \text{2-3 tree} &: \ 2^{h+1}-1 \text{ to } 3^{h+1}-1
\end{align*}
Check ($t=2$): $h=1$: 3 to 15 keys. \ $h=2$: 7 to 63 keys.\\
2-3 tree height: $\log_3 n \le h \le \log_2 n$, so $h \in \Th(\log n)$.
\end{keyb}

\subsection{Search}
\begin{code}
search(r, x):
  i <- 0
  while i < r.nitems and x > r.item[i]:  i <- i + 1
  if i < r.nitems and x = r.item[i]:     return (r, i)
  if r is a leaf:                        return null
  return search(r.children[i], x)
\end{code}

\subsection{Insert}
\begin{enumerate}[label=\textbf{\arabic*.}]
\item Walk down to the correct \textbf{leaf} and insert the key in sorted position.
\item If the node now has $m$ keys (overflow), \textbf{split}: the \textbf{median goes up} to the parent; smaller keys form the left node, larger keys the right node.
\item If the parent overflows, split it too, and so on upward.
\item If the \textbf{root} splits, the median becomes a new root: \textbf{height $+1$} (the only way a B-tree gets taller).
\end{enumerate}
For even $m$ there are two middle candidates; follow the stated convention.

\section{9 \quad B-Tree Deletion}
\begin{keyb}{Algorithm}
\textbf{Step 1: reach a leaf.} Key in a leaf: remove it. Key in an internal node: replace it with its in-order \textbf{successor} (min of the subtree to its right, always in a leaf) and delete that key from its leaf.\\[2pt]
\textbf{Step 2:} if the leaf still has $\ge$ the min number of keys, stop. (In a 2-3 tree, deleting from a 2-key leaf is free.)\\[2pt]
\textbf{Step 3: fix underflow, in this order}
\begin{enumerate}[label=\textbf{\arabic*.}]
\item \textbf{Rotate left} (right sibling has a spare key): separator moves \textbf{down} to the \textbf{end} of the deficient node; the right sibling's \textbf{first} key moves \textbf{up}.
\item \textbf{Rotate right} (left sibling has a spare): separator moves down to the \textbf{front}; the left sibling's \textbf{last} key moves up.
\item \textbf{Merge} (both adjacent siblings at the minimum): left node + separator + right node become one node. The parent loses a key.
\begin{itemize}
\item Parent is the root and is now empty: delete it. \textbf{Height $-1$} (the only way it shrinks).
\item Parent is now deficient: repeat Step 3 on the parent.
\end{itemize}
\end{enumerate}
\end{keyb}
\begin{itemize}
\item Siblings = \textbf{adjacent} children of the \textbf{same} parent only.
\item \textbf{Internal-node rotation:} the child next to the key that moves up goes along to the deficient node.
\end{itemize}

\subsection{Lecture examples, starting from T0}
\textbf{Delete 3:} successor 4 replaces it; leaf [4] empties. No right sibling; left sibling [2] is at the minimum, so merge [2] + 4.
\begin{center}
\begin{forest} bt
[5 [1\kk 3 [0] [2] [4]] [8 [6] [9]]]
\end{forest}\quad$\xrightarrow{\text{del } 3}$\quad
\begin{forest} bt
[5 [1 [0] [2\kk 4,\hl]] [8 [6] [9]]]
\end{forest}
\cp{T0 (left) and T0 after deleting 3 (right)}
\end{center}
\textbf{Then delete 9:} [9] empties; left sibling [6] is minimal, so merge to [6 8]. Node [8] is empty; its sibling [1] is minimal, so merge [1] + 5. The root is empty and is removed: height drops.
\begin{center}
\begin{forest} bt
[1\kk 5,\hl [0] [2\kk 4] [6\kk 8]]
\end{forest}
\qquad
\begin{forest} bt
[1\kk 6,\hl [0] [2\kk 4] [8]]
\end{forest}
\cp{After deleting 9 \qquad Then delete 5: successor 6 comes from [6 8], which has a spare.}
\end{center}

\subsection{Rotation examples}
\textbf{Leaf rotation:} delete 20 from [15 25]([5 10][20][30 35]). The right sibling has a spare, so rotate left.
\begin{center}
\begin{forest} bt
[15\kk 25 [5\kk 10] [20,\hl] [30\kk 35]]
\end{forest}\ $\to$\
\begin{forest} bt

\end{forest}
\end{center}
\textbf{Internal rotation:} delete 8 from T0. Successor 9; merge to [6 9]; node [9] is now empty. Left sibling [1 3] has a spare, so rotate right: 5 comes down, 3 goes up, and child [4] moves across.
\begin{center}
\begin{forest} bt
[3,\hl [1 [0] [2]] [5,\hl [4] [6\kk 9]]]
\end{forest}
\end{center}
\begin{howto}{any delete trace}
\begin{enumerate}[label=(\arabic*)]
\item Find the key; if internal, swap in the successor.
\item Remove it from the leaf.
\item Compare the key count to the minimum.
\item Check the \textbf{right} sibling, then the \textbf{left}, then \textbf{merge}.
\item Re-check the parent; repeat upward.
\item Verify the invariants.
\end{enumerate}
\end{howto}
\textbf{Invariants:} internal nodes have 2 (root) or $\cl{m/2}$ to $m$ children; no null children; $k+1$ children $\Leftrightarrow$ $k$ sorted keys; all leaves on the same level.

\textbf{Q1. Is this Heapify correct?}
\begin{code}
for i from 0 to floor(n/2) - 1:   SiftDown(A, n, i)    // top-down order
\end{code}
\textbf{No.} Max-heap on $[1,2,3,4]$: $i=0$ gives $[3,2,1,4]$; $i=1$ gives $[3,4,1,2]$. Root $3 < 4$. A node must be sifted \emph{after} its subtrees are heaps, so go bottom-up.

\textbf{Q2. Min-heap SiftDown swaps with the \emph{larger} child. Still correct?}\\
\textbf{No.} $[9,1,2]$: swapping 9 with 2 gives $[2,1,9]$, and root $2 > 1$.

\textbf{Q3. What does this return?}
\begin{code}
Mystery(r):  if r = null: return 0
             return 1 + max(Mystery(r.left), Mystery(r.right))
\end{code}
The number of \textbf{nodes} on the longest path $=$ height (in edges) $+1$. For one node it returns 1, but $h=0$.

\textbf{Q4. What does this print, and in what time?}
\begin{code}
F(r):  if r = null: return
       F(r.left);  print(r.item);  F(r.right)
\end{code}
In-order traversal: a BST's keys in \textbf{sorted} order, $\Th(n)$ (each node once).

\textbf{Q5. Is this a correct BST check?}
\begin{code}
isBST(r):  if r = null: return true
  if r.left != null and r.left.item > r.item:   return false
  if r.right != null and r.right.item <= r.item: return false
  return isBST(r.left) and isBST(r.right)
\end{code}
\textbf{No.} It only checks children. Counterexample: 5 with left child 3, and 3 has right child 6 (6 is in 5's left subtree). Fix: pass bounds down.
\begin{code}
isBST(r, lo, hi):  if r = null: return true
  if r.item < lo or r.item > hi: return false
  return isBST(r.left, lo, r.item) and isBST(r.right, r.item, hi)
\end{code}

\textbf{Q6. Write isHeap for a min-heap array.}
\begin{code}
isMinHeap(A, n):
  for i from 0 to floor(n/2) - 1:
    if 2i+1 < n and A[i] > A[2i+1]: return false
    if 2i+2 < n and A[i] > A[2i+2]: return false
  return true                                   // Theta(n)
\end{code}

/* ---------- tiny tree notation parser ----------
   "5(1,3(0|2|4)|8(6|9))"  → B-tree: keys comma-separated, children in (...) split by |
   "_" = null child (for BSTs)                                                     */
function parseTree(s){
  let i=0;
  function node(){
    if(s[i]==='_'){i++;return null;}
    let t='';
    while(i<s.length && !'(|)'.includes(s[i])) t+=s[i++];
    const n={k:t.split(',').map(x=>x.trim()),c:[]};
    if(s[i]==='('){ i++; n.c.push(node()); while(s[i]==='|'){i++; n.c.push(node());} i++; }
    return n;
  }
  return node();
}
function heapToTree(arr,i=0){
  if(i>=arr.length) return null;
  const n={k:[String(arr[i])],idx:i,c:[]};
  const l=heapToTree(arr,2*i+1), r=heapToTree(arr,2*i+2);
  if(l||r){ n.c=[l,r]; }
  return n;
}

lesson:`
<p class="lede">A heap answers one question fast: <em>what is the smallest (or largest) thing I have right now?</em> It is the standard way to build a priority queue.</p>

<h3>Why not just sort?</h3>
<p>Items arrive in random order and you keep asking for the minimum. Sorting every time costs O(n log n). Keeping a sorted array costs O(n) per insert (shifting). A binary heap gets both insert and remove-min down to <b>O(log n)</b>, and peeking at the min is <b>O(1)</b>.</p>

<h3>The two rules</h3>
<ol>
<li><b>Shape rule: the tree is complete.</b> Every level is full except possibly the last, and the last level fills from left to right with no gaps.</li>
<li><b>Order rule.</b> Min-heap: every parent ≤ its children. Max-heap: every parent ≥ its children.</li>
</ol>
<div class="note"><b>Key idea</b>The order rule only compares a parent with its own children. Siblings have no order, and a node on the left is not necessarily smaller than one on the right. A heap is <b>not</b> a BST and its array is <b>not</b> sorted.</div>
${H('9,10,17,23,34,89,22,28','Min-heap after inserting 23, 10, 17, 28, 34, 89, 22, 9. The index of each node is under it.')}

<h3>Storing it in an array</h3>
<p>Because the tree is complete, you can read it level by level into an array with no gaps. With the root at index 0:</p>
<div class="tbl"><table>
<tr><th>Relation</th><th>Formula</th><th>Example (i = 23)</th></tr>
<tr><td>left child</td><td class="mono">2i + 1</td><td class="mono">47</td></tr>
<tr><td>right child</td><td class="mono">2i + 2</td><td class="mono">48</td></tr>

<tr><td>last internal (non-leaf) node</td><td class="mono">⌊n/2⌋ − 1</td><td class="mono">n = 99 → 48</td></tr>
<tr><td>leaves</td><td class="mono">⌊n/2⌋ … n−1</td><td class="mono">there are ⌈n/2⌉ of them</td></tr>

<h3>Height</h3>
<p>This course counts height in <b>edges</b> (a single node has height 0). A complete tree with n nodes has height <code>h = ⌊log₂ n⌋</code>, so every heap is balanced and h ∈ Θ(log n).</p>
<ul>
<li>Fewest nodes at height h: <code>2^h</code> (levels 0..h−1 full, one node on level h).</li>
<li>Most nodes at height h: <code>2^(h+1) − 1</code> (every level full).</li>
</ul>
<p>Example from PSO 3: n = 99 sits between 64 = 2⁶ and 127 = 2⁷ − 1, so h = 6.</p>

<h3>Insert: add at the end, then sift up</h3>
<p>Put the new item in the first free slot (index n) so the shape rule holds. Then, while it is smaller than its parent (min-heap), swap it with the parent. This is called <em>swim</em> or <em>sift up</em>.</p>
<pre>algorithm SiftUp(A, i)            // min-heap
  p ← parent(i)
  while i > 0 and A[p] > A[i] do  // child smaller than parent → swap
    Swap(A, i, p)
    i ← p
    p ← parent(i)

algorithm Insert(B, x)
  if n = capacity then A ← Resize(A, 2·capacity)
  A[n] ← x ;  n ← n + 1
  SiftUp(A, n − 1)</pre>

<p>Cost: the item moves up at most one root-to-leaf path, so O(log n).</p>

<h3>Extract-min: swap in the last item, then sift down</h3>
<p>Save the root (the answer). Move the <b>last</b> item into the root and shrink n. Now the root may be too big, so repeatedly swap it with its <b>smaller</b> child until it is ≤ both children. This is <em>sink</em> or <em>sift down</em>.</p>
<pre>algorithm MinChildIndex(A, n, i)
  lc ← 2i+1 ; if lc ≥ n return n       // no children
  rc ← 2i+2 ; if rc ≥ n return lc      // only a left child
  if A[lc] &lt; A[rc] return lc else return rc   // tie → right child

algorithm SiftDown(A, n, i)
  m ← MinChildIndex(A, n, i)
  while m &lt; n and A[i] > A[m] do
    Swap(A, i, m) ; i ← m ; m ← MinChildIndex(A, n, i)

algorithm ExtractMin(B)
  if n = 0 throw EmptyHeap
  t ← A[0] ; A[0] ← A[n−1]
  SiftDown(A, n−1, 0) ; n ← n − 1
  return t</pre>

<div class="tbl"><table>

<tr><td>Peek (min/max)</td><td class="mono">O(1)</td><td>it is A[0]</td></tr>

<h3>Facts that show up as trick questions</h3>
<ul>
<li>The <b>max</b> of a min-heap is always a <b>leaf</b> (indices ⌊n/2⌋ … n−1), but it could be any leaf.</li>
<li>With distinct keys, the 2nd smallest in a min-heap is always a child of the root. The 3rd smallest is at depth 1 or 2.</li>
<li>A sorted ascending array <b>is</b> a valid min-heap. A min-heap array is <b>possibly</b> sorted.</li>
<li><b>How many places can a newly inserted item end up?</b> It starts at index n and can stop at any ancestor, so h + 1 places, where h is the height after inserting. PSO 3: n = 99, insert → 100 nodes, h = 6, answer 7.</li>
<li>Min-heap and max-heap code differ only in the comparison signs.</li>
</ul>

<ul>
<li>Complete tree + heap order (parent ≤ kids for min). Siblings unordered.</li>
<li>Root at 0: <b>L = 2i+1, R = 2i+2, P = ⌊(i−1)/2⌋</b></li>
<li>Last internal node ⌊n/2⌋−1; leaves ⌊n/2⌋…n−1 (⌈n/2⌉ leaves)</li>
<li>Height (edges) = ⌊log₂ n⌋; nodes at height h: 2^h … 2^(h+1)−1</li>
<li>Insert: put at A[n], sift <b>up</b> while smaller than parent. O(log n)</li>
<li>Extract: save A[0], A[0]←A[n−1], n−−, sift <b>down</b> swapping with <b>smaller</b> child (tie → right). O(log n)</li>
<li>Peek O(1); search O(n); n inserts O(n log n)</li>
<li>Max of min-heap is a leaf. Sorted array is a min-heap.</li>
<li># final spots for an insert = h+1 (h after insert)</li>
</ul>`,
quiz:[
{t:'mc',q:'A heap is stored in an array with the root at index 0. Where is the parent of the node at index 50?',o:['23','24','25','26'],a:1,e:'⌊(50 − 1)/2⌋ = ⌊24.5⌋ = 24.'},
{t:'mc',q:'Where is the right child of the node at index 31?',o:['62','63','64','65'],a:2,e:'2·31 + 2 = 64. (Left child would be 63.)'},
{t:'mc',q:'A heap has n = 50 items. What is the index of the last non-leaf node?',o:['23','24','25','49'],a:1,e:'⌊50/2⌋ − 1 = 24. Check: its left child is 2·24+1 = 49, the last index. Index 25 would have a left child at 51, which does not exist.'},
{t:'mc',q:'Insert 5, 3, 8, 1, 4, 7 (in that order) into an empty min-heap. What is the array?',o:['[1, 3, 4, 5, 7, 8]','[1, 3, 7, 5, 4, 8]','[1, 3, 8, 5, 4, 7]','[1, 4, 3, 5, 8, 7]'],a:1,e:'[5] → [3,5] → [3,5,8] → 1 lands at [3], swaps with 5 then 3 → [1,3,8,5] → 4 at [4], parent 3 is smaller, stays → [1,3,8,5,4] → 7 at [5], parent 8 is bigger, swap → [1,3,7,5,4,8]. Option 1 is sorted, which is a heap, but not the one this insertion order builds.'},
{t:'mc',q:'Run ExtractMin once on the min-heap [1, 3, 7, 5, 4, 8]. What is the array afterward?',o:['[3, 4, 7, 5, 8]','[3, 5, 7, 8, 4]','[3, 8, 7, 5, 4]','[4, 3, 7, 5, 8]'],a:0,e:'Move 8 to the root: [8,3,7,5,4]. Children 3 and 7 → swap with 3: [3,8,7,5,4]. Now 8 at index 1 has children 5 and 4 → swap with 4 (smaller): [3,4,7,5,8].'},
{t:'npf',q:'In a min-heap with distinct keys, the second-smallest key is a child of the root.',a:0,e:'The 2nd smallest has only the minimum above it in value, so its parent must be the root (its parent has to be smaller than it). Always true.'},
{t:'npf',q:'The array representation of a min-heap is sorted in ascending order.',a:1,e:'It can be (e.g. [1,2,3]) but usually is not (e.g. [1,3,2]).'},
{t:'npf',q:'In a min-heap of n ≥ 2 distinct keys, the largest key is stored at index 0.',a:2,e:'The root holds the minimum. The largest key is always at a leaf.'},
{t:'mc',q:'A min-heap has 20 items and you insert one more. How many different indices could the new item end up at?',o:['4','5','6','21'],a:1,e:'It starts at index 20. Its ancestors are 9, 4, 1, 0. So it can stop at 20, 9, 4, 1 or 0: five places. Same as h + 1 with h = ⌊log₂ 21⌋ = 4.'},

]},

{id:'heapify', title:'Heapify', time:'25 min',
lesson:`
<p class="lede">Heapify turns an arbitrary array into a heap <b>in place</b> in <b>O(n)</b> time, which beats n separate inserts at O(n log n).</p>

<h3>The idea: fix it from the bottom up</h3>
<p>Leaves are already valid one-node heaps. So start at the last internal node and move backwards to the root, calling SiftDown on each one. When you sift down node i, both of its subtrees are already heaps, so one SiftDown makes the subtree rooted at i a heap too.</p>
<pre>algorithm Heapify(A)
  n ← size of A
  for i from ⌊n/2⌋ − 1 down to 0 do
    SiftDown(A, n, i)</pre>
<p>This is also called <b>bottom-up</b> heap construction. Inserting items one at a time is <b>top-down</b>.</p>

<h3>Walkthrough: max-heapify [4, 6, 3, 5, 7, 1]</h3>
<p>n = 6, so i runs 2, 1, 0.</p>
${H('4,6,3,5,7,1','Start. Indices 3, 4, 5 are leaves.')}
<div class="tbl"><table>
<tr><th>i</th><th>Node</th><th>Action</th><th>Array</th></tr>
<tr><td class="mono">2</td><td>3</td><td>only child is 1; 3 ≥ 1, no swap</td><td class="mono">[4, 6, 3, 5, 7, 1]</td></tr>
<tr><td class="mono">1</td><td>6</td><td>children 5, 7; bigger is 7; swap</td><td class="mono">[4, 7, 3, 5, 6, 1]</td></tr>
<tr><td class="mono">0</td><td>4</td><td>children 7, 3; swap with 7</td><td class="mono">[7, 4, 3, 5, 6, 1]</td></tr>
<tr><td class="mono">(cont.)</td><td>4 now at [1]</td><td>children 5, 6; swap with 6</td><td class="mono">[7, 6, 3, 5, 4, 1]</td></tr>
</table></div>
${H('7,6,3,5,4,1','Result of heapify: [7, 6, 3, 5, 4, 1].')}

<h3>Same input, different heap</h3>
<p>Inserting 4, 6, 3, 5, 7, 1 one at a time into a max-heap gives <code>[7, 6, 3, 4, 5, 1]</code>. Heapify gives <code>[7, 6, 3, 5, 4, 1]</code>. Both are valid max-heaps. The two methods are <b>possibly</b> the same, not necessarily.</p>

<h3>Why is it O(n) and not O(n log n)?</h3>
<p>SiftDown from a node at height h does at most h swaps. Most nodes are near the bottom, where h is small:</p>
<ul>
<li>about n/2 nodes are leaves: 0 work (we skip them)</li>
<li>about n/4 nodes have height 1: at most 1 swap each</li>
<li>about n/8 nodes have height 2: at most 2 swaps each</li>
</ul>
<p>Total ≤ n·(1/4 + 2/8 + 3/16 + …) = n · Σ h/2^(h+1) ≤ n. The series Σ h/2^h converges to 2, a <b>constant</b>, so the total is O(n).</p>
<div class="trap"><b>Common mistake</b>That series is a (weighted) geometric sum. It converges to a constant. It does not give a log n factor.</div>

<h3>Second example: min-heapify [9, 4, 7, 1, 2, 6, 3]</h3>
<div class="tbl"><table>
<tr><th>i</th><th>Action</th><th>Array</th></tr>
<tr><td class="mono">2</td><td>7 vs children 6, 3 → swap with 3</td><td class="mono">[9, 4, 3, 1, 2, 6, 7]</td></tr>
<tr><td class="mono">1</td><td>4 vs children 1, 2 → swap with 1</td><td class="mono">[9, 1, 3, 4, 2, 6, 7]</td></tr>
<tr><td class="mono">0</td><td>9 vs 1, 3 → swap with 1; then 9 vs 4, 2 → swap with 2</td><td class="mono">[1, 2, 3, 4, 9, 6, 7]</td></tr>
</table></div>

<h3>Counting questions</h3>
<ul>
<li>First index SiftDown is called on: ⌊n/2⌋ − 1. For n = 13 that is 5.</li>
<li>Number of SiftDown calls: ⌊n/2⌋. For n = 100 that is 50.</li>
<li>Max swaps in a single SiftDown from the root of a heap of height h: h.</li>
</ul>

<h3>Heap lab</h3>
<p>Type an array, pick min or max, and watch each swap. Use it to check your hand traces.</p>
<div class="lab" id="heaplab">
  <div class="row">
    <label for="hl-in">Array</label>
    <input id="hl-in" value="4, 6, 3, 5, 7, 1" size="26">
    <label for="hl-mode">Order</label>
    <select id="hl-mode"><option value="max">max-heap</option><option value="min">min-heap</option></select>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn" data-act="heapify">Heapify (bottom-up)</button>
    <button class="btn" data-act="insert">Build by inserting</button>
    <button class="btn" data-act="extract">Extract root</button>
    <button class="btn" data-act="sort">Heap sort</button>
  </div>
  <div id="hl-fig" class="fig"></div>
  <div id="hl-log" class="log"></div>
</div>
`,
cheat:`
<pre>for i = ⌊n/2⌋−1 down to 0: SiftDown(A, n, i)</pre>
<ul>
<li>Bottom-up, in place, <b>O(n)</b>. n inserts (top-down) = O(n log n).</li>
<li>Leaves (⌊n/2⌋…n−1) skipped. # SiftDown calls = ⌊n/2⌋.</li>
<li>Why O(n): Σ (n/2^(h+1))·h = n·Σ h/2^(h+1) ≤ n. Converges, no log.</li>
<li>Heapify and repeated inserts can give <b>different</b> valid heaps.</li>
<li>Ex (max): [4,6,3,5,7,1] → [7,6,3,5,4,1]; inserts → [7,6,3,4,5,1]</li>
</ul>`,
quiz:[
{t:'mc',q:'Max-heapify the array [2, 8, 5, 3, 9, 1]. Result?',o:['[9, 8, 5, 3, 2, 1]','[9, 8, 5, 2, 3, 1]','[9, 2, 5, 3, 8, 1]','[8, 9, 5, 3, 2, 1]'],a:0,e:'n = 6, i = 2, 1, 0. i=2: 5 vs child 1, no swap. i=1: 8 vs 3, 9 → swap with 9: [2,9,5,3,8,1]. i=0: 2 vs 9, 5 → swap with 9: [9,2,5,3,8,1]; 2 now at [1] vs 3, 8 → swap with 8: [9,8,5,3,2,1].'},
{t:'mc',q:'Heapify is called on an array of n = 13 items. On which index is SiftDown called first?',o:['4','5','6','12'],a:1,e:'⌊13/2⌋ − 1 = 6 − 1 = 5.'},
{t:'mc',q:'How many times does Heapify call SiftDown on an array of 100 items?',o:['49','50','99','100'],a:1,e:'It loops from ⌊100/2⌋ − 1 = 49 down to 0, which is 50 calls.'},
{t:'mc',q:'What is the worst-case running time of Heapify?',o:['Θ(log n)','Θ(n)','Θ(n log n)','Θ(n²)'],a:1,e:'Bottom-up heap construction is linear. The sum over heights converges.'},
{t:'npf',q:'Building a heap by Heapify and by inserting the same items one at a time produces the same array.',a:1,e:'Sometimes yes, sometimes no. [4,6,3,5,7,1] gives [7,6,3,5,4,1] with heapify but [7,6,3,4,5,1] with inserts.'},
{t:'w',q:'Min-heapify [8, 6, 5, 2, 3, 1, 4]. Show the array after each iteration of the loop.',a:'n = 7, i = 2, 1, 0.<br>i=2: 5 vs 1, 4 → swap with 1 → [8, 6, 1, 2, 3, 5, 4]<br>i=1: 6 vs 2, 3 → swap with 2 → [8, 2, 1, 6, 3, 5, 4]<br>i=0: 8 vs 2, 1 → swap with 1 → [1, 2, 8, 6, 3, 5, 4]; 8 at [2] vs 5, 4 → swap with 4 → <b>[1, 2, 4, 6, 3, 5, 8]</b>'},
{t:'w',q:'Why does Heapify start at index ⌊n/2⌋ − 1 instead of n − 1?',a:'Indices ⌊n/2⌋ through n − 1 are leaves (their left child 2i + 1 would be ≥ n). A single node already satisfies the heap order, so calling SiftDown on it would do nothing.'}
]},

{id:'heapsort', title:'HeapSort', time:'25 min',
lesson:`
<p class="lede">HeapSort = Heapify, then repeatedly move the root to the end of the array. O(n log n) time, O(1) extra space, not stable.</p>

<h3>Which heap?</h3>
<ul>
<li>Ascending (non-descending) output → <b>max-heap</b>. The biggest item goes to the last slot first.</li>
<li>Descending output → min-heap.</li>
</ul>

<h3>Algorithm</h3>
<pre>algorithm HeapSort(A)
  n ← size of A
  Heapify(A)                       // max-heap, O(n)
  for i from n−1 down to 1 do      // "sort down"
    Swap(A, 0, i)                  // max goes to its final slot
    n ← n − 1                      // shrink the heap; A[i..] is sorted
    SiftDown(A, n, 0)              // repair the heap, O(log n)</pre>
<p>The array has two parts during sort-down: a heap on the left and a sorted suffix on the right. Shrinking n is what keeps SiftDown from touching the sorted suffix.</p>

<h3>Full trace on [4, 6, 3, 5, 7, 1]</h3>
<p>After Heapify: <code>[7, 6, 3, 5, 4, 1]</code>. Sorted suffix shown after the bar.</p>
<div class="tbl"><table>
<tr><th>i</th><th>Swap A[0] ↔ A[i]</th><th>After SiftDown on first n−1 items</th></tr>
<tr><td class="mono">5</td><td class="mono">[1, 6, 3, 5, 4 | 7]</td><td class="mono">[6, 5, 3, 1, 4 | 7]</td></tr>
<tr><td class="mono">4</td><td class="mono">[4, 5, 3, 1 | 6, 7]</td><td class="mono">[5, 4, 3, 1 | 6, 7]</td></tr>
<tr><td class="mono">3</td><td class="mono">[1, 4, 3 | 5, 6, 7]</td><td class="mono">[4, 1, 3 | 5, 6, 7]</td></tr>
<tr><td class="mono">2</td><td class="mono">[3, 1 | 4, 5, 6, 7]</td><td class="mono">[3, 1 | 4, 5, 6, 7]</td></tr>
<tr><td class="mono">1</td><td class="mono">[1 | 3, 4, 5, 6, 7]</td><td class="mono">done → [1, 3, 4, 5, 6, 7]</td></tr>
</table></div>

<h3>Running time</h3>
<p>Heapify O(n) + (n − 1) SiftDowns at O(log n) each = <b>O(n log n)</b>. Space is <b>Θ(1)</b> extra (in place).</p>
<p><b>Special case (PSO 4):</b> if all items are equal, every SiftDown stops immediately (no child is bigger), so each sort-down step is O(1) and HeapSort runs in <b>Θ(n)</b>.</p>

<h3>HeapSort is not stable</h3>
<p>Counterexample with two 2s, labelled a and b: input <code>[2a, 2b, 1]</code>.</p>
<ul>
<li>Heapify: root 2a vs children 2b, 1. 2a is not smaller than 2b, so no swap. Heap = [2a, 2b, 1].</li>
<li>i = 2: swap → [1, 2b, 2a]; SiftDown on first 2 → [2b, 1, 2a].</li>
<li>i = 1: swap → [1, 2b, 2a].</li>
</ul>
<p>Output 1, 2b, 2a: the two 2s swapped their original order. The long-distance swap of the root with the last item is what breaks stability.</p>

<h3>Good and bad</h3>
<ul>
<li>Good: guaranteed O(n log n) worst case, in place, short code.</li>
<li>Bad: poor cache behaviour in practice (jumps around the array); not stable.</li>
</ul>

<h3>PSO 4 idea: many small bags</h3>
<p>n items split into n/k bags of k items each. HeapSort each bag: (n/k)·O(k log k) = O(n log k). Then merge bags pairwise: log(n/k) rounds, O(n) per round = O(n log(n/k)). Total O(n log k + n log(n/k)) = O(n log n) at either extreme of k.</p>
`,
cheat:`
<pre>Heapify(A)  // MAX-heap for ascending
for i = n−1 down to 1:
  Swap(A,0,i); n−−; SiftDown(A,n,0)</pre>
<ul>
<li>Time O(n log n) worst; Space Θ(1) (in place); <b>NOT stable</b></li>
<li>All keys equal → Θ(n) (SiftDown stops at once)</li>
<li>Unstable ex: [2a,2b,1] → 1,2b,2a</li>
<li>Shrinking n protects the sorted suffix</li>
<li>O(n²) is a valid (loose) upper bound; Θ(n²) is false</li>
</ul>`,
quiz:[
{t:'mc',q:'To sort in ascending order with HeapSort as taught, which heap do you build?',o:['Min-heap','Max-heap','Either works the same','A BST'],a:1,e:'Each step moves the root to the end of the array, so the root must be the largest remaining item.'},
{t:'mc',q:'HeapSort on [3, 1, 4, 2, 5]: what is the array after Heapify and exactly one sort-down iteration?',o:['[4, 3, 1, 2, 5]','[4, 2, 3, 1, 5]','[5, 3, 4, 2, 1]','[1, 3, 4, 2, 5]'],a:0,e:'Heapify: i=1: 1 vs 2, 5 → swap with 5 → [3,5,4,2,1]. i=0: 3 vs 5, 4 → swap with 5 → [5,3,4,2,1]; 3 vs 2, 1 → stays. Sort-down i=4: swap → [1,3,4,2,5], n=4, SiftDown: 1 vs 3, 4 → swap with 4 → [4,3,1,2,5].'},
{t:'mc',q:'How much extra space does HeapSort use?',o:['Θ(1)','Θ(log n)','Θ(n)','Θ(n + k)'],a:0,e:'Everything happens by swaps inside the input array.'},
{t:'mc',q:'Worst-case running time of HeapSort when all n items are identical?',o:['Θ(1)','Θ(n)','Θ(n log n)','Θ(n²)'],a:1,e:'PSO 4 Q1: SiftDown never swaps because no child is strictly bigger, so each of the n−1 steps is O(1).'},
{t:'npf',q:'The worst-case running time of HeapSort is O(n²).',a:0,e:'Big-O is an upper bound. HeapSort is O(n log n), and n log n ∈ O(n²), so this is always true. It would be false if it said Θ(n²).'},
{t:'npf',q:'HeapSort preserves the relative order of equal keys on a given input.',a:1,e:'Not guaranteed (it is not a stable algorithm), but on some inputs, such as all-distinct keys or lucky arrangements, equal keys do end up in order.'},
{t:'w',q:'Give a small input that shows HeapSort is not stable, and trace it.',a:'[2a, 2b, 1]. Heapify leaves it as [2a, 2b, 1] (no child is strictly bigger than 2a). i=2: swap → [1, 2b, 2a], SiftDown → [2b, 1, 2a]. i=1: swap → [1, 2b, 2a]. Output order 2b before 2a, but the input had 2a first.'},
{t:'w',q:'During sort-down, why does SiftDown never move items that are already in the sorted suffix?',a:'Each iteration decrements n before calling SiftDown(A, n, 0). SiftDown only looks at children with index &lt; n, so the positions i, i+1, …, holding the already-placed maxima, are outside the heap.'}
]},

{id:'sorting', title:'Sorting Fundamentals', time:'25 min',
lesson:`
<p class="lede">What makes a sorting algorithm good, what "stable" means, and why no comparison sort can beat n log n.</p>

<h3>Four things to analyze</h3>
<div class="tbl"><table>
<tr><th>Property</th><th>Question it answers</th></tr>
<tr><td>Correctness (certification)</td><td>Is the output always sorted?</td></tr>
<tr><td>Running time</td><td>How many compares and swaps?</td></tr>
<tr><td>Stability</td><td>Do equal keys keep their input order?</td></tr>
<tr><td>Space</td><td>In place (O(1) extra) or needs a copy?</td></tr>
</table></div>

<h3>Stability</h3>
<p>A sort is <b>stable</b> if equal keys come out in the same relative order they went in. Tag duplicates to see it:</p>
<p>Input <code>[4, 3₁, 2₁, 7, 2₂, 1, 8, 3₂]</code>. Four outputs are sorted by value, but only <code>[1, 2₁, 2₂, 3₁, 3₂, 4, 7, 8]</code> is the stable one.</p>
<p>It matters when you sort records by one field and want an earlier sort by another field preserved (this is how radix sort works).</p>

<h3>Sorting = picking one permutation</h3>
<p>n items have n! orderings. A sorting algorithm figures out which one puts them in order. A comparison sort can only learn things by asking "is aᵢ ≤ aⱼ?".</p>

<h3>Decision-tree lower bound</h3>
<p>Draw every possible run of a comparison sort as a binary tree: each internal node is a comparison, each leaf is a final answer (a permutation).</p>
<ul>
<li>It needs at least <b>n!</b> leaves, one per possible input order.</li>
<li>A binary tree of height h has at most <b>2^h</b> leaves.</li>
<li>So 2^h ≥ n!, giving h ≥ log₂(n!). The height is the worst-case number of comparisons.</li>
</ul>
<p><b>log₂(n!) ∈ Ω(n log n):</b></p>
<pre>log₂(n!) = log 1 + log 2 + … + log n
         ≥ log(n/2) + … + log n        (keep only the top n/2 terms)
         ≥ (n/2) · log(n/2)            (each kept term ≥ log(n/2))
         ∈ Ω(n log n)</pre>
<div class="note"><b>Theorem</b>Every comparison sort needs Ω(n log n) comparisons in the worst case. HeapSort and MergeSort are therefore asymptotically optimal comparison sorts.</div>
<p>Small cases: n = 3 has 6 leaves, so ≥ ⌈log₂ 6⌉ = 3 comparisons. n = 4: ⌈log₂ 24⌉ = 5. n = 5: ⌈log₂ 120⌉ = 7.</p>
<p><b>The escape hatch:</b> the bound only applies to algorithms that compare items. Counting, bucket, pigeonhole and radix sort look at the key values directly (use them as indices), so they can run in linear time when the key range is small.</p>
<p>It is also a <b>worst case over all inputs</b>. If inputs are restricted (for example, every item is at most k slots from its sorted position), there are fewer possible permutations and you can go faster.</p>

<h3>Reference table</h3>
<div class="tbl"><table>
<tr><th>Algorithm</th><th>Time</th><th>Extra space</th><th>Stable</th><th>Compares?</th></tr>
<tr><td>HeapSort</td><td class="mono">O(n log n)</td><td class="mono">Θ(1)</td><td>No</td><td>Yes</td></tr>
<tr><td>MergeSort</td><td class="mono">Θ(n log n)</td><td class="mono">Θ(n)</td><td>Yes</td><td>Yes</td></tr>
<tr><td>QuickSort</td><td class="mono">avg n log n, worst n²</td><td class="mono">O(log n) stack</td><td>No</td><td>Yes</td></tr>
<tr><td>Insertion sort</td><td class="mono">O(n²), best O(n)</td><td class="mono">Θ(1)</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Counting sort</td><td class="mono">Θ(n + k)</td><td class="mono">Θ(n + k)</td><td>Yes</td><td>No</td></tr>
<tr><td>Pigeonhole sort</td><td class="mono">O(n + m)</td><td class="mono">O(n + m)</td><td>Yes</td><td>No</td></tr>
<tr><td>Bucket sort</td><td class="mono">avg O(n + n²/k + k), worst O(n²)</td><td class="mono">O(n + k)</td><td>If inner sort is</td><td>Inner sort may</td></tr>
<tr><td>Radix sort (LSD)</td><td class="mono">O(d(n + b))</td><td class="mono">O(n + b)</td><td>Yes</td><td>No</td></tr>
</table></div>

<h3>Necessarily / Possibly / Necessarily false</h3>
<p>These show up on every problem set. Decide like this:</p>
<ol>
<li><b>Necessarily true</b>: true for every input and every case the setup allows. You should be able to say why it can never fail.</li>
<li><b>Necessarily false</b>: can never be true. Find the reason it always fails.</li>
<li><b>Possibly true</b>: find one case where it holds and one where it does not.</li>
</ol>
<div class="trap"><b>Big-O traps</b>O is an upper bound. "HeapSort is O(n²)" is <b>necessarily true</b>. "HeapSort is Θ(n²)" is necessarily false. "Counting sort runs in O(n)" is possibly true (only when k ∈ O(n)). Always ask whether the claim depends on an input or on a parameter like k.</div>

<h2 id="npf-by-sort">Every sort: best vs. worst, and N/P/NF claims</h2>
<p>For each algorithm: whether its running time depends on the input, what triggers the best and worst cases, and typical exam claims sorted into <span class="chip nt">Necessarily true</span> <span class="chip pt">Possibly true</span> <span class="chip nf">Necessarily false</span>, each with a one-line reason.</p>
<div class="tbl"><table>
<tr><th>Sort</th><th>Best</th><th>Average</th><th>Worst</th><th>Best ≠ worst?</th><th>Extra space</th><th>Stable</th></tr>
<tr><td><b>HeapSort</b></td><td class="mono">Θ(n log n)*</td><td class="mono">Θ(n log n)</td><td class="mono">Θ(n log n)</td><td><span class="chip no">No</span></td><td>Θ(1), in place</td><td>No</td></tr><tr><td><b>MergeSort</b></td><td class="mono">Θ(n log n)</td><td class="mono">Θ(n log n)</td><td class="mono">Θ(n log n)</td><td><span class="chip no">No</span></td><td>Θ(n) extra array</td><td>Yes</td></tr><tr><td><b>QuickSort</b></td><td class="mono">Θ(n log n)</td><td class="mono">Θ(n log n)</td><td class="mono">Θ(n²)</td><td><span class="chip yes">Yes</span></td><td>O(log n) stack on average (in place)</td><td>No</td></tr><tr><td><b>Insertion sort</b></td><td class="mono">Θ(n)</td><td class="mono">Θ(n²)</td><td class="mono">Θ(n²)</td><td><span class="chip yes">Yes</span></td><td>Θ(1), in place</td><td>Yes</td></tr><tr><td><b>Counting sort</b></td><td class="mono">Θ(n + k)</td><td class="mono">Θ(n + k)</td><td class="mono">Θ(n + k)</td><td><span class="chip no">No</span></td><td>Θ(n + k) (arrays B and C)</td><td>Yes (backward last loop)</td></tr><tr><td><b>Pigeonhole sort</b></td><td class="mono">Θ(n + m)</td><td class="mono">Θ(n + m)</td><td class="mono">Θ(n + m)</td><td><span class="chip no">No</span></td><td>Θ(n + m)</td><td>Yes</td></tr><tr><td><b>Bucket sort</b></td><td class="mono">Θ(n)</td><td class="mono">Θ(n + n²/k + k)</td><td class="mono">Θ(n²)</td><td><span class="chip yes">Yes</span></td><td>Θ(n + k)</td><td>Only if the inner sort is</td></tr><tr><td><b>Radix sort (LSD)</b></td><td class="mono">Θ(d(n + b))</td><td class="mono">Θ(d(n + b))</td><td class="mono">Θ(d(n + b))</td><td><span class="chip no">No</span></td><td>Θ(n + b)</td><td>Yes</td></tr>
</table></div>
<div class="note"><b>How to read "Best ≠ worst?"</b>"No" means the running time doesn't depend on the order of the input. For those sorts, a claim like "runs faster on sorted input" is necessarily false. "Yes" means a claim about one input's running time is usually <b>possibly</b> true.</div>
<div class="alg"><div class="alg-h"><h3>HeapSort</h3><span class="chip no">same time on every input</span></div>
<div class="alg-t"><div><span class="lab">Best</span><span class="m2">Θ(n log n)*</span></div><div><span class="lab">Average</span><span class="m2">Θ(n log n)</span></div><div><span class="lab">Worst</span><span class="m2">Θ(n log n)</span></div></div>
<p class="when"><b>Best case:</b> *All keys equal: Θ(n), because SiftDown stops immediately (PSO 4).<br><b>Worst case:</b> Any input with distinct keys. Sorted or reverse-sorted input doesn't change it.</p>
<div class="npf3"><div class="col-nt"><h4>Necessarily true</h4><ul><li><b>Runs in O(n log n) in the worst case.</b> <span class="why">Heapify O(n) + (n−1) SiftDowns at O(log n).</span></li><li><b>Runs in O(n²).</b> <span class="why">Big-O is an upper bound; n log n ≤ n².</span></li><li><b>Uses Θ(1) extra space.</b> <span class="why">All work is swaps inside A.</span></li><li><b>Needs Ω(n log n) comparisons in the worst case.</b> <span class="why">It is a comparison sort.</span></li></ul></div><div class="col-pt"><h4>Possibly true</h4><ul><li><b>Keeps equal keys in their input order on a given input.</b> <span class="why">Sometimes by luck, but [2a, 2b, 1] → 1, 2b, 2a.</span></li><li><b>Runs in Θ(n) on a given input.</b> <span class="why">Yes if all keys are equal; no for distinct keys.</span></li><li><b>Is faster than counting sort on a given input.</b> <span class="why">Wins when k is huge, loses when k ∈ O(n).</span></li></ul></div><div class="col-nf"><h4>Necessarily false</h4><ul><li><b>Is stable.</b> <span class="why">Counterexample [2a, 2b, 1].</span></li><li><b>Runs in Θ(n²) in the worst case.</b> <span class="why">The worst case is Θ(n log n).</span></li><li><b>Runs in O(n) on every input.</b> <span class="why">Distinct keys force Ω(n log n) comparisons.</span></li><li><b>Needs Θ(n) extra space.</b> <span class="why">It is in place.</span></li></ul></div></div></div>
<div class="alg"><div class="alg-h"><h3>MergeSort</h3><span class="chip no">same time on every input</span></div>
<div class="alg-t"><div><span class="lab">Best</span><span class="m2">Θ(n log n)</span></div><div><span class="lab">Average</span><span class="m2">Θ(n log n)</span></div><div><span class="lab">Worst</span><span class="m2">Θ(n log n)</span></div></div>
<p class="when"><b>Best case:</b> Always splits in half and merges everything, whatever the order.<br><b>Worst case:</b> Same as best.</p>
<div class="npf3"><div class="col-nt"><h4>Necessarily true</h4><ul><li><b>Runs in Θ(n log n) on every input.</b> <span class="why">Always log n levels of O(n) merging.</span></li><li><b>Is stable.</b> <span class="why">Merge takes from the left half on ties.</span></li><li><b>Runs in O(n²).</b> <span class="why">Upper bound.</span></li></ul></div><div class="col-pt"><h4>Possibly true</h4><ul><li><b>Is faster than insertion sort on a given input.</b> <span class="why">Loses on an already-sorted input (insertion is Θ(n)).</span></li></ul></div><div class="col-nf"><h4>Necessarily false</h4><ul><li><b>Sorts in place (standard version).</b> <span class="why">Needs a Θ(n) buffer to merge.</span></li><li><b>Runs in O(n) on already-sorted input.</b> <span class="why">It still does all log n levels.</span></li></ul></div></div></div>
<div class="alg"><div class="alg-h"><h3>QuickSort</h3><span class="chip yes">time depends on input</span></div>
<div class="alg-t"><div><span class="lab">Best</span><span class="m2">Θ(n log n)</span></div><div><span class="lab">Average</span><span class="m2">Θ(n log n)</span></div><div><span class="lab">Worst</span><span class="m2">Θ(n²)</span></div></div>
<p class="when"><b>Best case:</b> Pivot splits the array roughly in half every time.<br><b>Worst case:</b> Pivot is always the min or max, e.g. sorted input with first/last-element pivot.</p>
<div class="npf3"><div class="col-nt"><h4>Necessarily true</h4><ul><li><b>Runs in O(n²).</b> <span class="why">That is its worst case.</span></li><li><b>Needs Ω(n log n) comparisons in the worst case.</b> <span class="why">It is a comparison sort.</span></li></ul></div><div class="col-pt"><h4>Possibly true</h4><ul><li><b>Runs in Θ(n²) on a given input.</b> <span class="why">Only with bad pivots.</span></li><li><b>Runs in Θ(n log n) on a given input.</b> <span class="why">With good pivots.</span></li><li><b>Keeps equal keys in order on a given input.</b> <span class="why">Not guaranteed.</span></li></ul></div><div class="col-nf"><h4>Necessarily false</h4><ul><li><b>Runs in O(n log n) in the worst case.</b> <span class="why">Bad pivots give Θ(n²).</span></li><li><b>Is stable.</b> <span class="why">Partitioning swaps items long distances.</span></li></ul></div></div></div>
<div class="alg"><div class="alg-h"><h3>Insertion sort</h3><span class="chip yes">time depends on input</span></div>
<div class="alg-t"><div><span class="lab">Best</span><span class="m2">Θ(n)</span></div><div><span class="lab">Average</span><span class="m2">Θ(n²)</span></div><div><span class="lab">Worst</span><span class="m2">Θ(n²)</span></div></div>
<p class="when"><b>Best case:</b> Already sorted: one comparison per item.<br><b>Worst case:</b> Reverse sorted: item i shifts past all i earlier items, Σ i = Θ(n²).</p>
<div class="npf3"><div class="col-nt"><h4>Necessarily true</h4><ul><li><b>Runs in O(n²).</b> <span class="why">Its worst case.</span></li><li><b>Is stable.</b> <span class="why">It never moves an item past an equal one.</span></li><li><b>Sorts in place.</b> <span class="why">Only shifts within A.</span></li></ul></div><div class="col-pt"><h4>Possibly true</h4><ul><li><b>Runs in O(n) on a given input.</b> <span class="why">Yes on sorted input, no on reverse-sorted.</span></li><li><b>Beats HeapSort on a given input.</b> <span class="why">On nearly sorted input.</span></li></ul></div><div class="col-nf"><h4>Necessarily false</h4><ul><li><b>Runs in O(n log n) in the worst case.</b> <span class="why">Reverse-sorted input is Θ(n²).</span></li><li><b>Runs in O(n) on every input.</b> <span class="why">Reverse-sorted is Θ(n²).</span></li></ul></div></div></div>
<div class="alg"><div class="alg-h"><h3>Counting sort</h3><span class="chip no">same time on every input</span></div>
<div class="alg-t"><div><span class="lab">Best</span><span class="m2">Θ(n + k)</span></div><div><span class="lab">Average</span><span class="m2">Θ(n + k)</span></div><div><span class="lab">Worst</span><span class="m2">Θ(n + k)</span></div></div>
<p class="when"><b>Best case:</b> The input order doesn't matter: it always makes the same 4 passes.<br><b>Worst case:</b> Same. The cost only depends on n and the key range k.</p>
<div class="npf3"><div class="col-nt"><h4>Necessarily true</h4><ul><li><b>Runs in Θ(n + k).</b> <span class="why">Passes of O(k), O(n), O(k), O(n).</span></li><li><b>Is stable.</b> <span class="why">The placement loop runs backwards.</span></li><li><b>Is not in place.</b> <span class="why">It allocates B (size n) and C (size k+1).</span></li><li><b>Doesn't compare keys, so the Ω(n log n) bound doesn't apply.</b> <span class="why">It uses keys as indices.</span></li></ul></div><div class="col-pt"><h4>Possibly true</h4><ul><li><b>Runs in O(n).</b> <span class="why">Only when k ∈ O(n).</span></li><li><b>Runs in Θ(n²).</b> <span class="why">Only when k ∈ Θ(n²).</span></li><li><b>Is faster than HeapSort.</b> <span class="why">Depends on k versus n log n.</span></li></ul></div><div class="col-nf"><h4>Necessarily false</h4><ul><li><b>Sorts in place.</b> <span class="why">B and C always exist.</span></li><li><b>Degrades to Θ(n²) because many items share one key.</b> <span class="why">Duplicates cost nothing extra; the time is still n + k.</span></li><li><b>Runs in O(n) on n keys in [0, n²].</b> <span class="why">Just initializing C costs Θ(n²).</span></li><li><b>Is stable if the last loop runs forwards.</b> <span class="why">[(3,a), (1,b), (3,c)] → (1,b), (3,c), (3,a).</span></li></ul></div></div></div>
<div class="alg"><div class="alg-h"><h3>Pigeonhole sort</h3><span class="chip no">same time on every input</span></div>
<div class="alg-t"><div><span class="lab">Best</span><span class="m2">Θ(n + m)</span></div><div><span class="lab">Average</span><span class="m2">Θ(n + m)</span></div><div><span class="lab">Worst</span><span class="m2">Θ(n + m)</span></div></div>
<p class="when"><b>Best case:</b> m = max − min + 1. Every item is one O(1) append; every hole is read once.<br><b>Worst case:</b> Same. All items in one hole is still just appends.</p>
<div class="npf3"><div class="col-nt"><h4>Necessarily true</h4><ul><li><b>Is stable (PS 2 Q1).</b> <span class="why">Items are appended and read back in input order.</span></li><li><b>Runs in O(n + m) (PS 2 Q2).</b> <span class="why">One pass to place, one to read the holes.</span></li><li><b>Uses Θ(n + m) space, so it is not in place (PS 2 Q3, Q4).</b> <span class="why">It allocates the holes.</span></li></ul></div><div class="col-pt"><h4>Possibly true</h4><ul><li><b>Beats a comparison sort on a given input.</b> <span class="why">Huge n and tiny range: yes. Few items and a huge range: no.</span></li><li><b>Wastes memory on a given input.</b> <span class="why">[10, 1, 1, …, 1] has 10 holes and uses 2.</span></li></ul></div><div class="col-nf"><h4>Necessarily false</h4><ul><li><b>Can degrade to O(n²) because all items fall in one hole (PS 2 Q7).</b> <span class="why">There is no sorting inside a hole.</span></li><li><b>Cannot waste memory (PS 2 Q5).</b> <span class="why">See [10, 1, 1, …, 1].</span></li><li><b>Can sort floats in [0, 1) directly.</b> <span class="why">Holes are one per integer value.</span></li></ul></div></div></div>
<div class="alg"><div class="alg-h"><h3>Bucket sort</h3><span class="chip yes">time depends on input</span></div>
<div class="alg-t"><div><span class="lab">Best</span><span class="m2">Θ(n)</span></div><div><span class="lab">Average</span><span class="m2">Θ(n + n²/k + k)</span></div><div><span class="lab">Worst</span><span class="m2">Θ(n²)</span></div></div>
<p class="when"><b>Best case:</b> About one item per bucket (keys spread evenly). With k = n and uniform keys, the average is O(n).<br><b>Worst case:</b> All n items land in one bucket and insertion sort runs inside it. With HeapSort or MergeSort inside, the worst case is O(n log n).</p>
<div class="npf3"><div class="col-nt"><h4>Necessarily true</h4><ul><li><b>Its worst case is O(n²) with insertion sort inside.</b> <span class="why">All items in one bucket.</span></li><li><b>Is not in place.</b> <span class="why">It allocates k lists.</span></li><li><b>Produces sorted output (if the inner sort is correct).</b> <span class="why">Buckets are in key order and each is sorted.</span></li></ul></div><div class="col-pt"><h4>Possibly true</h4><ul><li><b>Is stable.</b> <span class="why">Depends on the inner sort.</span></li><li><b>Runs in O(n).</b> <span class="why">Uniform keys: yes. All in one bucket: no.</span></li><li><b>Puts all items into one bucket.</b> <span class="why">Depends on how the keys are distributed.</span></li></ul></div><div class="col-nf"><h4>Necessarily false</h4><ul><li><b>Runs in O(n) on every input.</b> <span class="why">All in one bucket costs the inner sort's time.</span></li><li><b>Its running time doesn't depend on how the keys are distributed.</b> <span class="why">That's what decides best vs. worst.</span></li></ul></div></div></div>
<div class="alg"><div class="alg-h"><h3>Radix sort (LSD)</h3><span class="chip no">same time on every input</span></div>
<div class="alg-t"><div><span class="lab">Best</span><span class="m2">Θ(d(n + b))</span></div><div><span class="lab">Average</span><span class="m2">Θ(d(n + b))</span></div><div><span class="lab">Worst</span><span class="m2">Θ(d(n + b))</span></div></div>
<p class="when"><b>Best case:</b> d digit passes, each a counting sort on base b. Order of the input doesn't matter.<br><b>Worst case:</b> Same.</p>
<div class="npf3"><div class="col-nt"><h4>Necessarily true</h4><ul><li><b>Needs a stable sort on each digit.</b> <span class="why">Otherwise later passes undo earlier ones.</span></li><li><b>Is stable.</b> <span class="why">Every pass is stable.</span></li><li><b>Runs in Θ(d(n + b)).</b> <span class="why">d passes of Θ(n + b).</span></li></ul></div><div class="col-pt"><h4>Possibly true</h4><ul><li><b>Runs in O(n).</b> <span class="why">When d is constant and b ∈ O(n).</span></li><li><b>Beats MergeSort.</b> <span class="why">Depends on d versus log n.</span></li></ul></div><div class="col-nf"><h4>Necessarily false</h4><ul><li><b>Is correct with an unstable per-digit sort.</b> <span class="why">Not guaranteed: 12, 21 can come out wrong.</span></li><li><b>Is a comparison sort.</b> <span class="why">It indexes by digit value.</span></li></ul></div></div></div>
<div class="alg"><div class="alg-h"><h3>Any comparison sort (general claims)</h3></div>
<div class="npf3"><div class="col-nt"><h4>Necessarily true</h4><ul><li><b>Needs Ω(n log n) comparisons in the worst case.</b> <span class="why">Decision-tree bound.</span></li><li><b>Its decision tree has at least n! leaves.</b> <span class="why">One per input order.</span></li></ul></div><div class="col-pt"><h4>Possibly true</h4><ul><li><b>Runs in O(n) on a given input.</b> <span class="why">Insertion sort on sorted input.</span></li><li><b>Runs in O(n log k) on k-sorted input.</b> <span class="why">Restricted inputs have fewer orders.</span></li></ul></div><div class="col-nf"><h4>Necessarily false</h4><ul><li><b>Runs in O(n) in the worst case on arbitrary input.</b> <span class="why">Contradicts the lower bound.</span></li><li><b>Sorts 5 items with 6 comparisons in the worst case.</b> <span class="why">⌈log₂ 120⌉ = 7.</span></li></ul></div></div></div>
`,
cheat:`
<ul>
<li>Stable = equal keys keep input order. Matters for multi-key / radix sorts.</li>
<li>n! permutations → decision tree ≥ n! leaves; 2^h ≥ n! → h ≥ log₂ n!</li>
<li>log₂ n! ≥ (n/2)log₂(n/2) ∈ Ω(n log n)</li>
<li><b>Any comparison sort: Ω(n log n) worst case.</b> Non-comparison sorts (counting, bucket, radix) escape by indexing on keys.</li>
<li>Min worst-case compares: n=3→3, n=4→5, n=5→7 (⌈log₂ n!⌉)</li>
<li>N/P/NF: "O(bigger)" = necessarily true; depends on k or input = possibly</li>
</ul>
<div class="tbl"><table>
<tr><th>Sort</th><th>Time</th><th>Space</th><th>Stable</th></tr>
<tr><td>Heap</td><td>n log n</td><td>1</td><td>N</td></tr>
<tr><td>Merge</td><td>n log n</td><td>n</td><td>Y</td></tr>
<tr><td>Counting</td><td>n+k</td><td>n+k</td><td>Y</td></tr>
<tr><td>Bucket</td><td>n avg / n² worst</td><td>n+k</td><td>if inner</td></tr>
<tr><td>Radix</td><td>d(n+b)</td><td>n+b</td><td>Y</td></tr>
</table></div>`,
quiz:[
{t:'mc',q:'What is the smallest possible worst-case number of comparisons for a comparison sort on 4 items?',o:['3','4','5','6'],a:2,e:'4! = 24 leaves. 2^h ≥ 24 → h ≥ log₂ 24 ≈ 4.58, so at least 5.'},
{t:'mc',q:'Input [3a, 1, 3b, 2]. Which output is the stable sorted result?',o:['[1, 2, 3b, 3a]','[1, 2, 3a, 3b]','[3a, 3b, 1, 2]','Both of the first two are stable'],a:1,e:'3a came before 3b in the input, so a stable sort keeps 3a first.'},
{t:'npf',q:'Some comparison-based algorithm sorts any array of n integers in O(n) worst-case time.',a:2,e:'The decision-tree bound says every comparison sort needs Ω(n log n) comparisons in the worst case.'},
{t:'npf',q:'A non-comparison sorting algorithm sorts n integers in O(n) time.',a:1,e:'Counting sort is Θ(n + k). That is O(n) only when the key range k is O(n).'},
{t:'npf',q:'A comparison sort finishes on an already-sorted input in O(n) time.',a:1,e:'Insertion sort does (one comparison per item). HeapSort does not; it still does Θ(n log n) work on sorted distinct keys.'},
{t:'mc',q:'Which of these sorts is in place?',o:['Counting sort','MergeSort','HeapSort','Bucket sort'],a:2,e:'HeapSort uses Θ(1) extra space. The others need auxiliary arrays or lists.'},
{t:'w',q:'Sketch why log₂(n!) ∈ Ω(n log n).',a:'log₂(n!) = Σ_{i=1..n} log₂ i ≥ Σ_{i=n/2..n} log₂ i ≥ (n/2)·log₂(n/2) = (n/2)(log₂ n − 1), which is Ω(n log n).'},
{t:'w',q:'Why does the Ω(n log n) lower bound not apply to counting sort?',a:'The bound is for algorithms whose only way to learn about the input is comparing pairs of items. Counting sort never compares items; it uses each key directly as an array index, so the decision-tree argument does not describe it.'}
]},

{id:'counting', title:'Counting Sort', time:'35 min',
lesson:`
<p class="lede">If keys are small integers 0…k, you can sort without comparing anything: count how many of each value there are, then compute where each value's block starts.</p>

<h3>Algorithm</h3>
<pre>algorithm CountingSort(A, k)             // keys in 0..k
  C ← array of k+1 zeros                  // Step 1   O(k)
  for i from 0 to n−1:                    // Step 2   O(n)
    C[A[i]] ← C[A[i]] + 1                 //   C[v] = # of items equal to v
  for i from 1 to k:                      // Step 3   O(k)
    C[i] ← C[i] + C[i−1]                  //   C[v] = # of items ≤ v
  B ← array of size n
  for i from n−1 down to 0:               // Step 4   O(n)  (BACKWARDS)
    B[C[A[i]] − 1] ← A[i]
    C[A[i]] ← C[A[i]] − 1
  return B</pre>
<p>After step 3, <code>C[v]</code> is one past the last slot where a v can go. Going backwards, the last v in A takes that last slot, then C[v] drops so the next v (earlier in A) goes just before it.</p>

<h3>Full trace (lecture example), k = 5</h3>
<p>A = (2,A) (5,C) (3,H) (0,B) (2,X) (3,B) (0,X) (3,D). The letter is a payload so you can see stability.</p>
<div class="tbl"><table>
<tr><th></th><th class="mono">0</th><th class="mono">1</th><th class="mono">2</th><th class="mono">3</th><th class="mono">4</th><th class="mono">5</th></tr>
<tr><td>Counts (step 2)</td><td class="mono">2</td><td class="mono">0</td><td class="mono">2</td><td class="mono">3</td><td class="mono">0</td><td class="mono">1</td></tr>
<tr><td>Prefix sums (step 3)</td><td class="mono">2</td><td class="mono">2</td><td class="mono">4</td><td class="mono">7</td><td class="mono">7</td><td class="mono">8</td></tr>
</table></div>
<div class="tbl"><table>
<tr><th>i</th><th>A[i]</th><th>C[key] before</th><th>Placed at B[…]</th><th>C[key] after</th></tr>
<tr><td class="mono">7</td><td class="mono">(3,D)</td><td class="mono">7</td><td class="mono">6</td><td class="mono">6</td></tr>
<tr><td class="mono">6</td><td class="mono">(0,X)</td><td class="mono">2</td><td class="mono">1</td><td class="mono">1</td></tr>
<tr><td class="mono">5</td><td class="mono">(3,B)</td><td class="mono">6</td><td class="mono">5</td><td class="mono">5</td></tr>
<tr><td class="mono">4</td><td class="mono">(2,X)</td><td class="mono">4</td><td class="mono">3</td><td class="mono">3</td></tr>
<tr><td class="mono">3</td><td class="mono">(0,B)</td><td class="mono">1</td><td class="mono">0</td><td class="mono">0</td></tr>
<tr><td class="mono">2</td><td class="mono">(3,H)</td><td class="mono">5</td><td class="mono">4</td><td class="mono">4</td></tr>
<tr><td class="mono">1</td><td class="mono">(5,C)</td><td class="mono">8</td><td class="mono">7</td><td class="mono">7</td></tr>
<tr><td class="mono">0</td><td class="mono">(2,A)</td><td class="mono">3</td><td class="mono">2</td><td class="mono">2</td></tr>
</table></div>
<p>B = (0,B) (0,X) (2,A) (2,X) (3,H) (3,B) (3,D) (5,C). Equal keys kept their input order: stable.</p>

<h3>Why the last loop must go backwards</h3>
<p>Forward order breaks stability. PS 2 Q10 counterexample: A = [(3,a), (1,b), (3,c)], prefix sums C[1] = 1, C[3] = 3.</p>
<ul>
<li>Forward: (3,a) → B[2], (1,b) → B[0], (3,c) → B[1]. Output (1,b) (3,c) (3,a). The 3s flipped: <b>unstable</b>.</li>
<li>Backward: (3,c) → B[2], (1,b) → B[0], (3,a) → B[1]. Output (1,b) (3,a) (3,c). <b>Stable</b>.</li>
</ul>
<p>(Filling forward works only if you use the <em>start</em> of each block, i.e. shifted prefix sums, and increment.)</p>

<h3>Cost</h3>
<ul>
<li>Time <b>Θ(n + k)</b>. It is Θ(n) only when k ∈ O(n).</li>
<li>Space <b>Θ(n + k)</b> (arrays B and C). Not in place.</li>
<li>Stable, because of the backwards placement loop.</li>
</ul>
<div class="trap"><b>Check your k</b>n = 1,000 unique IDs in 0…10⁹ (PS 2 Q11): C has a billion entries (~4 GB), and zeroing it alone is 10⁹ steps, versus about n log n ≈ 10⁴ for MergeSort/HeapSort/QuickSort. Counting sort is a terrible choice there.</div>
<div class="trap"><b>Digit-count trap (PSO 4)</b>Integers with up to k digits, where k ∈ Θ(n): the largest value is 99…9 (k nines) = 10^k − 1, so counting sort costs O(n + 10^n): exponential. A comparison sort at O(n log n) wins.</div>

<h3>Negative or offset keys</h3>
<p>Shift every key by the minimum: <code>index(v) = v − min</code>, and use <code>max − min + 1</code> counters. Temperatures in [−100, 20]: index = v + 100, array size 121 (PS 2 Q8, Q9).</p>

<h3>Range-count queries in O(1) (PSO 4)</h3>
<p>Do steps 1 to 3 once (Θ(n + k)). Then the number of items in [a, b] is <code>C[b] − C[a−1]</code> (or just <code>C[b]</code> if a = 0).</p>
`,
cheat:`
<pre>C[0..k]=0; for x in A: C[x]++
for v=1..k: C[v]+=C[v−1]       // C[v] = # ≤ v
for i=n−1 DOWNTO 0:            // backwards → stable
  B[C[A[i]]−1]=A[i]; C[A[i]]−−</pre>
<ul>
<li>Θ(n+k) time, Θ(n+k) space, <b>stable</b>, not in place</li>
<li>Forward last loop → unstable. Ex [(3,a),(1,b),(3,c)] → (1,b),(3,c),(3,a)</li>
<li>Negative range: idx = v − min; size = max − min + 1</li>
<li># in [a,b] = C[b] − C[a−1] after prefix sums (O(1) query)</li>
<li>Bad when k ≫ n (IDs up to 10⁹; k-digit numbers → 10^k)</li>
</ul>`,
quiz:[
{t:'mc',q:'A = [3, 0, 2, 3, 1, 0], k = 3. What is C after the prefix-sum step?',o:['[2, 1, 1, 2]','[2, 3, 4, 6]','[0, 2, 3, 4]','[2, 3, 5, 6]'],a:1,e:'Counts: two 0s, one 1, one 2, two 3s → [2,1,1,2]. Running totals → [2, 3, 4, 6].'},
{t:'mc',q:'Continuing: the placement loop starts at i = 5 (A[5] = 0). Which index of B does it write?',o:['0','1','2','5'],a:1,e:'C[0] = 2, so B[2 − 1] = B[1]. Then C[0] becomes 1, so the earlier 0 at A[1] will go to B[0].'},
{t:'mc',q:'Keys are integers in [−50, 30]. How large must the count array be, and what index does −7 map to?',o:['80 and 43','81 and 43','81 and 57','80 and 42'],a:1,e:'Size = 30 − (−50) + 1 = 81. Index = −7 − (−50) = 43.'},
{t:'npf',q:'Counting sort runs in O(n) time.',a:1,e:'It is Θ(n + k). Linear only if k ∈ O(n).'},
{t:'npf',q:'Counting sort (as written in lecture) sorts in place.',a:2,e:'It always allocates C (size k+1) and B (size n).'},
{t:'npf',q:'Counting sort on n integers in the range [0, n²] runs in O(n) time.',a:2,e:'Here k = n², and the algorithm spends Θ(k) just initializing and summing C, so the time is Θ(n²), never O(n).'},
{t:'w',q:'Using A = [3, 0, 2, 3, 1, 0] and its prefix-sum array, how many items lie in the range [1, 3]? Show the formula.',a:'C = [2, 3, 4, 6]. Count = C[3] − C[0] = 6 − 2 = 4 (the items 3, 2, 3, 1).'},
{t:'w',q:'Your intern wrote the placement loop forwards (i = 0 to n−1). Show with a small example that the result is no longer stable.',a:'A = [(3,a), (1,b), (3,c)]. Prefix sums: C[1] = 1, C[3] = 3. Forward: (3,a) → B[2], C[3]=2; (1,b) → B[0]; (3,c) → B[1]. B = (1,b), (3,c), (3,a): the two 3s reversed.'},
{t:'w',q:'Why is counting sort a bad choice for 1,000 unique user IDs in 0…10⁹, and what should you use instead?',a:'Time and space are Θ(n + k) with k = 10⁹. You must allocate and zero a billion-entry array (gigabytes of memory, 10⁹ steps) to sort only 1,000 items. A comparison sort (MergeSort, HeapSort, QuickSort) takes about n log n ≈ 10⁴ steps.'}
]},
