{id:'bucket', title:'Bucket Sort', time:'30 min',
lesson:`
<p class="lede">Split the key range into buckets, drop each item into its bucket, sort each bucket, and concatenate. Fast when items spread evenly.</p>

<h3>Warm-up: sort words by length in O(n)</h3>
<p>No dictionary word is longer than 45 letters. Make 45 linked lists. Put a word of length l into list l − 1 (O(1) each). Join the 45 lists in order (45 is a constant). Total O(n). Same words keep their input order inside a list, so it is stable.</p>

<h3>Algorithm (k buckets)</h3>
<pre>algorithm BucketSort(A, k)
  B ← array of k empty lists
  M ← (max key in A) + 1
  for i from 0 to n−1:
    j ← ⌊k · A[i] / M⌋          // bucket index 0..k−1
    B[j].insert(A[i])
  for i from 0 to k−1:
    sort list B[i]
  return concatenation B[0], B[1], …, B[k−1]</pre>
<p>The classic version assumes keys in [0, 1) and uses k = n buckets with j = ⌊n·A[i]⌋. Dividing by M = max + 1 maps integer keys into [0, 1) first.</p>

<h3>Trace: [29, 25, 3, 49, 9, 37, 21, 43], n = k = 8, M = 50</h3>
<div class="tbl"><table>
<tr><th>Key</th><td class="mono">29</td><td class="mono">25</td><td class="mono">3</td><td class="mono">49</td><td class="mono">9</td><td class="mono">37</td><td class="mono">21</td><td class="mono">43</td></tr>
<tr><th>8·key/50</th><td class="mono">4.64</td><td class="mono">4.0</td><td class="mono">0.48</td><td class="mono">7.84</td><td class="mono">1.44</td><td class="mono">5.92</td><td class="mono">3.36</td><td class="mono">6.88</td></tr>
<tr><th>Bucket</th><td class="mono">4</td><td class="mono">4</td><td class="mono">0</td><td class="mono">7</td><td class="mono">1</td><td class="mono">5</td><td class="mono">3</td><td class="mono">6</td></tr>
</table></div>
<p>Buckets: 0:[3] 1:[9] 2:[] 3:[21] 4:[29, 25] 5:[37] 6:[43] 7:[49]. Sort bucket 4 → [25, 29]. Concatenate → [3, 9, 21, 25, 29, 37, 43, 49].</p>

<h3>Why it is correct</h3>
<p>The bucket formula is monotone: a bigger key never lands in a smaller-numbered bucket. So every key in bucket i is ≤ every key in bucket i + 1. Sort inside each bucket and concatenate in order, and the whole thing is sorted.</p>

<h3>Running time depends on four things</h3>
<p>n, k, how evenly keys spread, and which sort you use inside buckets.</p>
<div class="tbl"><table>
<tr><th>Case</th><th>Time</th><th>Example</th></tr>
<tr><td>Best</td><td class="mono">O(n)</td><td>about one item per bucket</td></tr>
<tr><td>Average (uniform keys)</td><td class="mono">O(n + n²/k + k)</td><td>k = n → O(n)</td></tr>
<tr><td>Worst</td><td class="mono">O(n²)</td><td>all items in one bucket, sorted with insertion sort</td></tr>
</table></div>
<p>Use MergeSort or HeapSort inside the buckets and the worst case drops to O(n log n). Bucket sort is <b>stable if</b> the inner sort is stable and inserts append.</p>
<p>Relationship: counting sort is bucket sort with one bucket per possible value.</p>

<h3>Pigeonhole sort (Problem Set 2)</h3>
<p>One "pigeonhole" per value in [min, max], m = max − min + 1 holes. Append each item to hole A[i] − min, then read the holes in order. No sorting inside holes, because every item in a hole has the same key.</p>
<ul>
<li>Time O(n + m), space O(n + m), stable, not in place.</li>
<li>It <b>cannot</b> degrade to O(n²): appends are O(1) and holes are never sorted (PS 2 Q7: necessarily false).</li>
<li>It can waste memory: [10, 1, 1, …, 1] allocates 10 holes to use 2.</li>
<li>Best fit: many items, tiny range (500,000 integers in 1…100). Worst fit: few items, huge range; floats (no integer holes).</li>
</ul>

<h3>Radix sort and the PSO 5 problem</h3>
<p><b>LSD radix sort:</b> sort by the last digit, then the next digit, and so on, each pass using a <b>stable</b> counting sort on one digit (base b = 10). d digits → O(d(n + b)). Stability is what keeps the earlier passes' work.</p>
<p><b>PSO 5:</b> m integers with 1…k digits each (k ∈ Θ(m)), n total digits, lengths uniform. Bucket by digit count into k buckets (B[dᵢ − 1]), radix sort each bucket, concatenate. Shorter numbers are smaller, so bucket order is correct. Bucket i holds ≈ m/k numbers of i + 1 digits, so the work is Σ (i+1)(m/k) = O(n) because m/k is a constant.</p>
`,
cheat:`
<pre>M = max+1; j = ⌊k·A[i]/M⌋; B[j].insert(A[i])
sort each B[j]; concatenate B[0..k−1]</pre>
<ul>
<li>Best O(n); avg O(n + n²/k + k) (uniform, k=n → O(n)); worst O(n²) (one bucket + insertion sort)</li>
<li>Stable iff inner sort stable. Counting sort = 1 bucket per value.</li>
<li><b>Pigeonhole</b>: m = max−min+1 holes, O(n+m) time & space, stable, never n², can waste memory; best: huge n, tiny range</li>
<li>Radix LSD: stable counting sort per digit, O(d(n+b))</li>
<li>PSO5: bucket by #digits, radix each → O(total digits)</li>
</ul>`,
quiz:[
{t:'mc',q:'BucketSort with k = 5 buckets on A = [12, 45, 3, 30, 27]. Which bucket does 27 go into? (M = max + 1 = 46)',o:['1','2','3','4'],a:1,e:'⌊5·27/46⌋ = ⌊135/46⌋ = ⌊2.93⌋ = 2.'},
{t:'mc',q:'BucketSort with k = 4 on A = [7, 1, 5, 9, 3] (M = 10). What does bucket 2 hold before the buckets are sorted?',o:['[5]','[5, 7]','[7, 5]','[7]'],a:2,e:'j = ⌊4·A/10⌋: 7 → 2, 1 → 0, 5 → 2, 9 → 3, 3 → 1. Items are inserted in input order, so bucket 2 is [7, 5] until it is sorted.'},
{t:'mc',q:'Worst-case running time of bucket sort if insertion sort is used inside the buckets?',o:['O(n)','O(n log n)','O(n + k)','O(n²)'],a:3,e:'Every item can land in the same bucket, and insertion sort on n items is O(n²).'},
{t:'npf',q:'The running time of pigeonhole sort degrades to O(n²) when all n items fall in the same pigeonhole.',a:2,e:'Items in one hole all have the same key and are only appended (O(1)). There is no sorting inside holes, so the time stays O(n + m). (PS 2 Q7)'},
{t:'npf',q:'Bucket sort is stable.',a:1,e:'It depends on the sort used inside each bucket. With a stable inner sort and appending inserts, yes; with HeapSort inside, not guaranteed.'},
{t:'mc',q:'Which input is the best fit for pigeonhole sort?',o:['200 integers from 0 to 50,000,000','1,000,000 ages from 0 to 120','10,000 floats in [0, 1)','60 integers from 1 to 1,000'],a:1,e:'Pigeonhole is O(n + m). Large n with tiny m = 121 makes it essentially linear. A huge range wastes space; floats have no integer holes.'},
{t:'w',q:'Describe an O(n) algorithm to sort n English words by length (assume length is O(1) to read).',a:'Create 45 empty lists (max word length). For each word of length l, append it to list l − 1: O(1) each, O(n) total. Concatenate the 45 lists in order: a constant number of O(1) joins. Total O(n), and it is stable.'},
{t:'w',q:'In PSO 5, why does bucketing by number of digits and then radix-sorting each bucket give a correctly sorted array?',a:'A number with fewer digits is always smaller than one with more digits (no leading zeros), so every number in bucket i is smaller than every number in bucket i+1. Radix sort correctly sorts inside a bucket, so concatenating the buckets in order is sorted.'}
]},

{id:'bst', title:'Binary Search Tree', time:'35 min',
lesson:`
<p class="lede">A binary tree where every node is bigger than everything in its left subtree and smaller than everything in its right subtree. Search, insert and delete all follow one root-to-leaf path.</p>

<h3>Definition</h3>
<p>A binary tree is null or a root with a left and right binary tree. A <b>BST</b> adds the order rule: for every node, all keys in its left subtree are ≤ it and all keys in its right subtree are &gt; it. (The lecture's insert sends <b>equal keys left</b>.)</p>
<p>In-order traversal of a BST lists the keys in <b>sorted</b> order.</p>

<h3>Search</h3>
<pre>algorithm search(root, x)
  if root is null return null
  if x = root.item return root
  if x &lt; root.item return search(root.left, x)
  return search(root.right, x)</pre>

<h3>Insert</h3>
<p>Search for x until you hit a null link, and hang a new node there. The shape depends entirely on insertion order.</p>
<pre>algorithm insert(root, x)
  if root is null return new node(x)
  if x ≤ root.item: root.left ← insert(root.left, x)
  else:             root.right ← insert(root.right, x)
  return root</pre>
<div class="figrow">
${B('4(2(1(0|_)|3)|6(5|7(_|8(_|9))))','Insert 4, 2, 6, 1, 3, 5, 7, 0, 8, 9. Height 4 (4→6→7→8→9).')}
${B('A(_|C(_|E(_|H(_|R(_|S(_|X))))))','Insert sorted keys A…X: a linked list, height n − 1.')}
</div>

<h3>Delete: three cases</h3>
<ol>
<li><b>Leaf</b>: remove it.</li>
<li><b>One child</b>: replace the node with its child.</li>
<li><b>Two children</b>: copy in the <b>in-order successor</b> (the minimum of the right subtree), then delete that successor from the right subtree. The successor has no left child, so its deletion is case 1 or 2.</li>
</ol>
<pre>algorithm delete(root, x)
  if root is null return null
  if x &lt; root.item:  root.left  ← delete(root.left, x)
  elif x > root.item: root.right ← delete(root.right, x)
  else
    if root.left is null  return root.right
    if root.right is null return root.left
    s ← findmin(root.right)
    root.item ← s.item
    root.right ← delete(root.right, s.item)
  return root</pre>
<div class="figrow">
${B('5(3(1(_|2)|4)|8(7|9))','Before: delete 5 (two children).','5')}
${B('7(3(1(_|2)|4)|8(_|9))','After: successor 7 (min of right subtree) moves up.','7')}
</div>
<p>You could also use the in-order <em>predecessor</em> (max of left subtree). Both are valid; the lecture code uses the successor.</p>

<h3>Sorted array → balanced BST</h3>
<p>Make the middle element the root and recurse on each half.</p>
<pre>algorithm generateBST(A, l, r)
  if r &lt; l return null
  m ← ⌊(l + r)/2⌋
  root ← new node(A[m])
  root.left  ← generateBST(A, l, m−1)
  root.right ← generateBST(A, m+1, r)
  return root</pre>
${B('H(C(A|E)|S(R|X))','generateBST on [A, C, E, H, R, S, X].')}

<h3>Height decides everything</h3>
<p>Height counts edges (PS 2 Q12: inserting 4, 2, 8, 0, 1, 3 gives height 3 along 4→2→0→1). Balanced means |height(left) − height(right)| ≤ 1 at every node, which forces height O(log n).</p>
<div class="tbl"><table>
<tr><th>Operation</th><th>Unbalanced (worst)</th><th>Balanced</th></tr>
<tr><td>Search / insert / delete one</td><td class="mono">O(n)</td><td class="mono">O(log n)</td></tr>
<tr><td>Insert all n</td><td class="mono">O(n²)</td><td class="mono">O(n log n)</td></tr>
</table></div>
<p>PSO 5 Q2(1): inserting keys in descending order puts each new key left of the leftmost node, so insert i costs i: Σ i = Θ(n²).</p>

<h3>A property that looks true but is not (PSO 5)</h3>
<p>Claim: searching for a key that ends at a leaf splits keys into A (left of the path), B (on the path), C (right of the path), with a ≤ b ≤ c always. Counterexample: search for 4 below. A = {2}, B = {1, 3, 4}, C = ∅. But 2 &gt; 1, so a ≤ b fails.</p>
${B('1(_|3(2|4))','Search path 1 → 3 → 4.','1,3,4')}
<p>Minimum number of nodes for height h: h + 1. Maximum: 2^(h+1) − 1.</p>
`,
cheat:`
<ul>
<li>left ≤ node &lt; right (lecture insert: x ≤ root → left). In-order = sorted.</li>
<li>Search/insert/delete follow 1 path: O(h). h ∈ [⌊log₂ n⌋, n−1]</li>
<li>Delete: leaf → remove; 1 child → splice; 2 children → copy <b>successor = min(right)</b>, delete it from right</li>
<li>Successor of a 2-child node has no left child</li>
<li>Sorted / reverse-sorted inserts → height n−1, total Θ(n²)</li>
<li>generateBST: root = A[⌊(l+r)/2⌋], recurse halves → height ⌊log₂ n⌋</li>
<li>Height = edges. Balanced: |h(L)−h(R)| ≤ 1 everywhere</li>
<li>Search-path "A ≤ B ≤ C" is false: tree 1→3→(2,4), search 4</li>
</ul>`,
quiz:[
{t:'mc',q:'Insert 5, 3, 8, 1, 4, 7, 9, 2 into an empty BST. What is the height?',o:['2','3','4','7'],a:1,e:'2 goes 5 → 3 → 1 → right of 1. Longest path 5 → 3 → 1 → 2 has 3 edges.'},
{t:'mc',q:'Same tree. What is the pre-order traversal?',o:['5, 3, 1, 2, 4, 8, 7, 9','1, 2, 3, 4, 5, 7, 8, 9','5, 3, 8, 1, 4, 7, 9, 2','2, 1, 4, 3, 7, 9, 8, 5'],a:0,e:'Root, then left subtree (3, 1, 2, 4), then right (8, 7, 9). Option 2 is in-order; option 3 is level-order; option 4 is post-order.'},
{t:'mc',q:'Delete 5 (the root) from that tree using the successor rule. What is the new pre-order?',o:['4, 3, 1, 2, 8, 7, 9','7, 3, 1, 2, 4, 8, 9','8, 3, 1, 2, 4, 7, 9','7, 3, 1, 2, 4, 9, 8'],a:1,e:'Successor = min of right subtree {8, 7, 9} = 7. Copy 7 into the root and remove the leaf 7. New tree: 7 with left 3(1(_,2), 4) and right 8(_, 9).'},
{t:'mc',q:'generateBST on [1, 2, 3, 4, 5, 6, 7, 8]. What is the root and the height?',o:['Root 4, height 3','Root 5, height 3','Root 4, height 2','Root 5, height 2'],a:0,e:'m = ⌊(0+7)/2⌋ = 3 → A[3] = 4. Right half [5,6,7,8] → root 6, then [7,8] → root 7 with right child 8. Path 4 → 6 → 7 → 8 = 3 edges.'},
{t:'mc',q:'Insert 10, 5, 15, 3, 7, 12, 20, 6 into an empty BST. Height?',o:['2','3','4','5'],a:1,e:'6 goes 10 → 5 → 7 → left of 7. That path has 3 edges.'},
{t:'npf',q:'Searching a BST with n nodes takes O(log n) time.',a:1,e:'True if the tree is balanced, false for a degenerate (list-shaped) tree where search is Θ(n).'},
{t:'npf',q:'The in-order successor of a node that has two children has no left child.',a:0,e:'The successor is the minimum of the right subtree. If it had a left child, that child would be smaller and still in the right subtree.'},
{t:'w',q:'What is the total cost of inserting n keys in decreasing order into an empty BST? Justify.',a:'Θ(n²). Each new key is smaller than all previous ones, so it walks all the way down the left spine. The i-th insert visits i − 1 nodes; Σ (i − 1) = n(n−1)/2 ∈ Θ(n²).'}
]},

{id:'btree', title:'B-Tree', time:'40 min',
lesson:`
<p class="lede">A search tree whose nodes hold several keys. It stays perfectly balanced (every leaf at the same depth) by splitting full nodes and growing <b>upward</b> from the root.</p>

<h3>Why</h3>
<p>Designed by Bayer and McCreight (1972) for data on disk. Reading one node is one slow disk access, so you want wide, shallow trees: many keys per node, few levels.</p>

<h3>Properties of a B-tree of order m (Knuth)</h3>
<div class="tbl"><table>
<tr><th>Rule</th><th>Order m</th><th>2-3 tree (m = 3)</th><th>2-3-4 tree (m = 4)</th></tr>
<tr><td>Max children per node</td><td class="mono">m</td><td class="mono">3</td><td class="mono">4</td></tr>
<tr><td>Max keys per node</td><td class="mono">m − 1</td><td class="mono">2</td><td class="mono">3</td></tr>
<tr><td>Min children, internal non-root</td><td class="mono">⌈m/2⌉</td><td class="mono">2</td><td class="mono">2</td></tr>
<tr><td>Min keys, non-root</td><td class="mono">⌈m/2⌉ − 1</td><td class="mono">1</td><td class="mono">1</td></tr>
<tr><td>Root</td><td colspan="3">at least 2 children unless it is a leaf (so ≥ 1 key)</td></tr>
<tr><td>Keys vs children</td><td colspan="3">a non-leaf with c children has exactly c − 1 keys</td></tr>
<tr><td>Leaves</td><td colspan="3">all on the same level</td></tr>
</table></div>
<p>Keys inside a node are sorted. Key i is a separator: everything in child i is smaller, everything in child i+1 is larger.</p>
${T('M(E,J(A,C|H|L)|R(P|S,X))','A 2-3 tree. 2-nodes have 1 key and 2 children; 3-nodes have 2 keys and 3 children.')}

<h3>Height</h3>
<p>For a 2-3 tree with n nodes, height is between log₃ n and log₂ n, so Θ(log n). In general a B-tree has height O(log n); bigger m means flatter.</p>

<h3>Search</h3>
<pre>algorithm search(root, x)
  i ← 0
  while i &lt; root.nitems and x > root.item[i]: i ← i + 1
  if i &lt; root.nitems and x = root.item[i]: return (root, i)
  if root is a leaf: return null
  return search(root.children[i], x)</pre>
<p>Scan the keys in the node; stop at the first key ≥ x. If equal, found. Otherwise go down child i.</p>

<h3>Insert: always at a leaf, split upward</h3>
<ol>
<li>Search down to the leaf where x belongs and insert it in sorted position.</li>
<li>If the leaf now has m keys (one too many), <b>split</b>: the <b>median</b> key moves up into the parent; keys left of it form one node, keys right of it form another.</li>
<li>If that overflows the parent, split the parent the same way, and so on.</li>
<li>If the root splits, the median becomes a <b>new root</b>. This is the only way a B-tree gets taller.</li>
</ol>
<div class="note"><b>Even m</b>For order 4, an overflowing node has 4 keys and two middle candidates. The PS 2 question on order 4 only asks for the height, which is the same either way. If a question depends on the choice, it will state the convention; the lecture points to the USFCA visualizer for practice.</div>

<h3>Full trace: 2-3 tree, insert 8, 2, 3, 4, 0, 9, 6, 5, 1</h3>
<div class="figrow">
${T('3(2|8)','8, 2, then 3: leaf [2,3,8] overflows, 3 goes up as new root.','3')}
${T('3(0,2|4,8)','4 and 0 fit in leaves.')}
${T('3,8(0,2|4|9)','9: leaf [4,8,9] splits, 8 goes up.','8')}
${T('3,8(0,2|4,6|9)','6 fits in [4, 6].')}
</div>
<div class="figrow">
${T('5(3(0,2|4)|8(6|9))','5: leaf [4,5,6] splits (5 up) → root [3,5,8] splits (5 up, new root). Height grows to 2.','5')}
${T('5(1,3(0|2|4)|8(6|9))','1: leaf [0,1,2] splits, 1 goes up into [1, 3].','1')}
</div>

<h3>Counting B-trees (PS 2 Q15)</h3>
<p>How many 2-3 trees store {0, 1, 2, 3, 4, 8}? Count by height.</p>
<ul>
<li>Height 0: a single node holds at most 2 keys. No.</li>
<li>Height 1, root with 1 key: 2 leaves with at most 2 keys each hold ≤ 4, total ≤ 5. No.</li>
<li>Height 1, root with 2 keys: 3 leaves must hold the other 4 keys, each 1 or 2 keys: sizes (2,1,1), (1,2,1), (1,1,2). <b>3 trees.</b></li>
<li>Height 2: needs at least 7 keys. No.</li>
</ul>
<p>Once you fix the node sizes, the key sorting fixes which key goes where, so each size pattern is exactly one tree.</p>

<h3>Minimum degree t (CLRS style, PSO 5)</h3>
<ul>
<li>Every non-root node: t − 1 to 2t − 1 keys (t to 2t children).</li>
<li>Root: at least 1 key.</li>
<li>t = 2 is the <b>2-3-4 tree</b> (order 4). A 2-3 tree does not fit this definition (it would need max 2t − 1 = 2 keys with t = 1.5).</li>
<li>Max keys at height h: every node full with 2t children: <b>(2t)^(h+1) − 1</b>.</li>
<li>Min keys at height h: root 1 key, others t − 1 keys with t children: <b>2t^h − 1</b>.</li>
</ul>
<p>Check with t = 2, h = 1: max 4² − 1 = 15 (root 3 keys + 4 leaves × 3). Min 2·2 − 1 = 3 (root 1 key + 2 leaves × 1). The 2-3-4 trees storing {1, 2, 3, 4, 5}: 4 of them.</p>
`,

{id:'bdelete', title:'B-Tree Deletion', time:'40 min',
lesson:`
<p class="lede">Remove the key, then repair any node that dropped below the minimum by borrowing from a sibling (rotation) or merging with one.</p>

<h3>Step 1: get the deletion down to a leaf</h3>
<ul>
<li><b>Key is in a leaf</b>: remove it.</li>
<li><b>Key is in an internal node</b>: it is a separator, so you can't just drop it. Replace it with its in-order <b>successor</b> (the smallest key in the subtree to its right, always in a leaf) or predecessor. That removes a key from a leaf instead. The lecture examples use the successor.</li>
</ul>
<p>If the leaf still has at least the minimum number of keys, you are done. In a 2-3 tree that means deleting from a leaf with 2 keys is free.</p>

<h3>Step 2: fix underflow (in this order)</h3>
<ol>
<li><b>Rotate left</b>: if the right sibling has a spare key, move the parent's separator <em>down</em> to the end of the deficient node, and move the right sibling's <em>first</em> key <em>up</em> to replace it.</li>
<li><b>Rotate right</b>: otherwise, if the left sibling has a spare key, move the separator down to the front of the deficient node and the left sibling's <em>last</em> key up.</li>
<li><b>Merge</b>: otherwise (both immediate siblings are at the minimum), glue the deficient node, the separator between them, and a sibling into one node. The parent loses a key.
  <ul>
  <li>If the parent is the root and is now empty, delete it; the merged node is the new root. <b>The tree gets shorter.</b></li>
  <li>If the parent is now deficient, repeat step 2 on the parent.</li>
  </ul></li>
</ol>
<div class="note"><b>Rotations on internal nodes</b>When the deficient node is internal, a rotation also moves one child pointer: the child next to the key that moved up goes along to the deficient node (the right sibling's first child in a left rotation; the left sibling's last child in a right rotation). Otherwise the key/child counts would not match.</div>
<div class="note"><b>Direction words</b>"Rotate left" means keys flow leftward: right sibling → parent → deficient node. Siblings only count if they are <b>adjacent</b> under the same parent.</div>

<h3>Lecture example: start tree</h3>
${T('5(1,3(0|2|4)|8(6|9))','The tree built by inserting 8, 2, 3, 4, 0, 9, 6, 5, 1.')}

<h3>Delete 3 (internal key)</h3>
<ul>
<li>Replace 3 with its successor 4. The leaf [4] becomes empty.</li>
<li>That leaf is the last child, so it has no right sibling. Left sibling [2] has only 1 key (the minimum). Merge: [2] + separator 4 → [2, 4].</li>
<li>Parent [1, 4] loses the 4 → [1], still legal.</li>
</ul>
${T('5(1(0|2,4)|8(6|9))','After deleting 3.','2,4')}

<h3>Delete 9 (cascading merge, tree shrinks)</h3>
<ul>
<li>Leaf [9] becomes empty. No right sibling; left sibling [6] is minimal. Merge [6] + 8 → [6, 8].</li>
<li>Parent [8] is now empty (0 keys, 1 child): deficient. Its sibling [1] has only 1 key: merge [1] + separator 5 + (empty) → [1, 5], taking all 3 children.</li>
<li>The root lost its only key, so it disappears. Height drops from 2 to 1.</li>
</ul>
${T('1,5(0|2,4|6,8)','After deleting 9.','1,5')}

<h3>Delete 5 (internal key, leaf has a spare)</h3>
<ul>
<li>Successor of 5 is 6 (min of the subtree to its right, [6, 8]). Copy 6 into the root; remove it from [6, 8] → [8]. Still legal. Done.</li>
</ul>
${T('1,6(0|2,4|8)','After deleting 5.','6')}

<h3>Example with a rotation</h3>
<p>From root [15, 25] with leaves [5, 10] [20] [30, 35], delete 20. Leaf [20] empties. Right sibling [30, 35] has a spare, so rotate left: separator 25 comes down → [25]; 30 goes up. Result root [15, 30] with leaves [5, 10] [25] [35].</p>
<div class="figrow">
${T('15,25(5,10|20|30,35)','Before.','20')}
${T('15,30(5,10|25|35)','After rotate left.','25,30')}
</div>

<h3>Invariants to check after any deletion</h3>
<ol>
<li>Every internal node has between 2 (root) or ⌈m/2⌉ and m children.</li>
<li>No internal node has a null child.</li>
<li>A node with k + 1 children has exactly k sorted keys.</li>
<li>All leaves are on the same level.</li>
</ol>
`,
cheat:`
<ul>
<li>Internal key → replace with <b>successor</b> (min of right subtree, a leaf key), delete that from leaf</li>
<li>Leaf still ≥ min keys → done (2-3: deleting from a 2-key leaf is free)</li>
<li>Underflow fix order: <b>(1) rotate left</b> from right sibling w/ spare; <b>(2) rotate right</b> from left sibling w/ spare; <b>(3) merge</b> node + separator + sibling</li>
<li>Rotate: separator down, sibling's end key up (internal: move adjacent child too)</li>
<li>Merge → parent loses key → may cascade; empty root removed → height −1 (only way it shrinks)</li>
<li>Lecture: T0 = 5 / [1,3]([0][2][4]) / [8]([6][9]); del 3 → 5/[1]([0][2,4])/[8]([6][9]); del 9 → [1,5]([0][2,4][6,8]); del 5 → [1,6]([0][2,4][8])</li>
</ul>`,

{t:'mc',q:'A deficient node has both a left sibling with a spare key and a right sibling with a spare key. Following the lecture order, what happens?',o:['Rotate right (borrow from left)','Rotate left (borrow from right)','Merge with the left sibling','Merge with the right sibling'],a:1,e:'The lecture checks the right sibling first: rotate left.'}

{name:'Part A · TallySort (22 pts)',intro:`<p>Consider this algorithm for arrays of non-negative integers.</p><pre>1: function TallySort(A : array of ℤ≥0)
2:   k ← max(A);  n ← size of A
3:   Let C be an array of k+1 zeros
4:   for i from 0 to n−1 do
5:     C[A[i]] ← C[A[i]] + 1
6:   end for
7:   idx ← 0
8:   for v from 0 to k do
9:     for j from 1 to C[v] do
10:      A[idx] ← v ;  idx ← idx + 1
11:    end for
12:  end for
13:  return A</pre><p>True or False. Justify each answer.</p>`,qs:[
{t:'tf',pts:4,q:'TallySort runs in O(n + k) time.',a:true,e:'Lines 4–6 are O(n). The outer loop on line 8 runs k+1 times, and the inner loop runs C[v] times; Σ C[v] = n, so lines 8–12 are O(n + k) in total.'},
{t:'tf',pts:4,q:'Because of the nested loops on lines 8–9, TallySort runs in Θ(n·k) time in the worst case.',a:false,e:'The inner loop does not run n times per v. Across all v it runs exactly n times altogether. Total is Θ(n + k).'},
{t:'tf',pts:4,q:'TallySort sorts in place.',a:false,e:'It allocates C with k + 1 entries, so it uses Θ(k) extra space.'},
{t:'tf',pts:4,q:'TallySort can be used to stably sort records (key, payload) by key.',a:false,e:'It never moves the original items. It rewrites values from counts, so payloads are lost. Stability does not even make sense for its output. Use real counting sort (with output array B) for records.'},
{t:'npf',pts:3,q:'TallySort sorts a given input faster than HeapSort does.',a:1,e:'With small k (e.g. k ∈ O(n)) it is linear and beats HeapSort\'s n log n. With huge k (e.g. [0, 10⁹]) it is far slower.'},

{t:'tf',pts:4,q:'MinHeapSort runs in O(n log n) time.',a:true,e:'n inserts at O(log n) plus n extractions at O(log n).'},

{t:'npf',pts:4,q:'Lines 3–5 take Θ(n log n) time.',a:1,e:'Depends on the input. Decreasing input makes every new item sift to the root: Θ(n log n). Increasing input needs no swaps at all: Θ(n).'},
{t:'tf',pts:3,q:'MinHeapSort is stable.',a:false,e:'Counterexample: A = [1, 2a, 2b, 0]. Inserting 0 sifts it up past 2a, giving H = [0, 1, 2b, 2a]. Extract 0: 2a moves to the root and sinks below 1 → [1, 2a, 2b]. Extract 1: 2b moves to the root; 2a is not strictly smaller, so no swap → [2b, 2a]. Output 0, 1, 2b, 2a: the 2s are reversed.'},

{t:'w',pts:8,q:'Finish the placement loop (backwards). Give B and the final contents of C.',a:'i=5 (4,U): B[5], C[4]=5 · i=4 (3,T): B[3], C[3]=3 · i=3 (0,S): B[0], C[0]=0 · i=2 (1,R): B[2], C[1]=2 · i=1 (4,Q): B[4], C[4]=4 · i=0 (1,P): B[1], C[1]=1.<br><b>B = (0,S) (1,P) (1,R) (3,T) (4,Q) (4,U)</b>; final <b>C = [0, 1, 3, 3, 4]</b>. Each C[v] now points at the first slot of v\'s block.'},
{t:'mc',pts:4,q:'Temperatures are integers in [−40, 50]. What count-array size do you need, and where does 0 °C go?',o:['90, index 40','91, index 40','91, index 50','90, index 50'],a:1,e:'50 − (−40) + 1 = 91. Index = 0 − (−40) = 40.'},
{t:'w',pts:8,q:'BucketSort with k = 5 on A = [34, 7, 91, 55, 62, 18, 40]. Using M = max + 1 = 92 and j = ⌊k·A[i]/M⌋, list each bucket before sorting.',a:'34 → ⌊170/92⌋ = 1; 7 → 0; 91 → ⌊455/92⌋ = 4; 55 → ⌊275/92⌋ = 2 (275 &lt; 276); 62 → ⌊310/92⌋ = 3; 18 → ⌊90/92⌋ = 0; 40 → ⌊200/92⌋ = 2.<br><b>B0 = [7, 18], B1 = [34], B2 = [55, 40], B3 = [62], B4 = [91]</b>'},
{t:'mc',pts:3,q:'Which inner sort gives bucket sort a worst case of O(n log n)?',o:['Insertion sort','HeapSort','Recursive bucket sort','Any sort, since buckets are small'],a:1,e:'In the worst case all n items land in one bucket, so the bucket\'s sort decides the worst case. HeapSort (or MergeSort) is O(n log n).'},
{t:'npf',pts:3,q:'Bucket sort with n buckets on n integers runs in Θ(n) time.',a:1,e:'With uniformly spread keys, yes (expected O(n)). If all keys land in one bucket, the inner sort dominates.'}

{name:'Part C · Trees (36 pts)',qs:[
{t:'w',pts:8,q:'Insert 8, 3, 10, 1, 6, 14, 4, 7, 13 into an empty BST. Then delete 3, then delete 8 (successor rule). Give the pre-order of the final tree and its height.',a:'Build: 8 / (3: 1, 6(4, 7)) and (10: _, 14(13, _)).<br>Delete 3: successor = min of {6, 4, 7} = 4 → 8 / (4: 1, 6(_, 7)) / (10: _, 14(13)).<br>Delete 8: successor = 10 (it has no left child). 10 moves up; 10\'s old spot is replaced by its right child 14.<br><b>Pre-order: 10, 4, 1, 6, 7, 14, 13. Height 3</b> (10 → 4 → 6 → 7).'},
{t:'w',pts:4,q:'Run generateBST on the sorted array [2, 4, 6, 8, 10, 12]. Give the pre-order and height.',a:'m = ⌊5/2⌋ = 2 → root 6. Left [2, 4]: m = 0 → 2 with right child 4. Right [8, 10, 12]: m = 4 → 10 with children 8, 12.<br><b>Pre-order 6, 2, 4, 10, 8, 12. Height 2.</b>'},
{t:'mc',pts:4,q:'How many different 2-3 trees store exactly {1, 2, 3, 4, 5}?',o:['1','2','3','4'],a:1,e:'Height 1, root 1 key: 4 keys in 2 leaves of ≤ 2 → only (2, 2): 1 tree. Root 2 keys: 3 keys in 3 leaves → (1, 1, 1): 1 tree. Height 0 or 2 impossible. Total 2.'},
{t:'mc',pts:4,q:'A B-tree with minimum degree t = 2 has height 2. What are the min and max numbers of keys?',o:['7 and 63','7 and 48','5 and 63','3 and 15'],a:0,e:'Min 2t^h − 1 = 2·4 − 1 = 7. Max (2t)^(h+1) − 1 = 4³ − 1 = 63.'},
{t:'w',pts:8,q:'2-3 tree: root [20]; left child [10] with leaves [5] [15]; right child [30, 40] with leaves [25] [35] [45]. Delete 15. Draw the result, naming each fix.',a:'Leaf [15] empties. No right sibling under [10]; left sibling [5] is minimal → <b>merge</b> [5] + 10 → [5, 10]. Node [10] now has 0 keys → deficient. Its right sibling [30, 40] has a spare → <b>rotate left</b>: 20 moves down, 30 moves up, and 30\'s left child [25] moves over.<br><b>Root [30]; left [20] with [5, 10] [25]; right [40] with [35] [45].</b>'},
{t:'npf',pts:2,q:'A 2-3 tree of height h has at least 2^(h+1) − 1 keys.',a:0,e:'The fewest keys is when every node is a 2-node: a perfect binary tree with 2^(h+1) − 1 nodes, one key each.'},
{t:'npf',pts:2,q:'Deleting a key from a B-tree decreases its height.',a:1,e:'Only if merges cascade up to the root and empty it.'},
{t:'npf',pts:2,q:'In a min-heap of distinct keys, the third-smallest key is at depth 2.',a:1,e:'It is at depth 1 or 2: either the other child of the root, or a child of the 2nd smallest.'},
{t:'npf',pts:2,q:'Heapify performs Θ(n log n) swaps in the worst case.',a:2,e:'Heapify is O(n) in total, so it cannot do Θ(n log n) swaps.'}
]},
{name:'Part D · Short answer (12 pts)',qs:[
{t:'w',pts:6,q:'Show that HeapSort runs in Θ(n) when all n keys are equal.',a:'Heapify is O(n) regardless. In each of the n − 1 sort-down steps, the swap is O(1), and SiftDown compares the new root with its children, finds no child strictly larger, and stops after O(1) work. So sort-down is (n − 1)·O(1), and the total is Θ(n).'},
{t:'w',pts:6,q:'What is the total cost of inserting n keys in decreasing order into an empty BST? Justify with a sum.',a:'Each new key is smaller than everything already there, so it follows the left spine to the bottom. The i-th insertion visits i − 1 nodes. Σ_{i=1..n} (i − 1) = n(n − 1)/2 ∈ <b>Θ(n²)</b>.'}
]}
]},

{id:'t3',title:'Practice Test 3',parts:[
{name:'Part A · KSort (22 pts)',intro:`<p>An array is <b>k-sorted</b> if every item is at most k positions away from its position in sorted order.</p><pre>1: function KSort(A : k-sorted array, k : ℤ≥0)
2:   Let H be an empty min-heap;  n ← size of A
3:   for i from 0 to min(k, n−1) do
4:     Insert(H, A[i])
5:   end for
6:   idx ← 0
7:   for i from k+1 to n−1 do
8:     A[idx] ← ExtractMin(H);  idx ← idx + 1
9:     Insert(H, A[i])
10:  end for
11:  while H is not empty do
12:    A[idx] ← ExtractMin(H);  idx ← idx + 1
13:  end while</pre><p>True or False. Justify.</p>`,qs:[
{t:'tf',pts:4,q:'KSort runs in O(n log k) time.',a:true,e:'The heap never holds more than k + 1 items, so each Insert and ExtractMin is O(log k). There are n of each.'},
{t:'tf',pts:4,q:'When k = 0, KSort runs in O(n) time.',a:true,e:'A 0-sorted array is already sorted; the heap has size 1, so each operation is O(1).'},
{t:'tf',pts:4,q:'KSort uses Θ(k) extra space.',a:true,e:'The heap holds at most k + 1 items (for k &lt; n).'},
{t:'tf',pts:5,q:'KSort with small k contradicts the Ω(n log n) lower bound for comparison sorting.',a:false,e:'The lower bound is a worst case over all n! input orders. k-sorted inputs are a much smaller set of permutations (each item has at most 2k+1 possible positions, so at most (2k+1)^n orders), so fewer comparisons are needed: log₂((2k+1)^n) = n·log₂(2k+1), which matches O(n log k).'},
{t:'tf',pts:5,q:'Setting k = n − 1 turns KSort into a correct O(n log n) sort for any array.',a:true,e:'Every array is (n−1)-sorted. All items go into the heap, then come out in order: a heap sort with O(log n) operations.'}
]},
{name:'Part B · Heaps and sorting (34 pts)',qs:[
{t:'w',pts:6,q:'The array [2, 5, 3, 9, 6, 4, 8, 10, 12] is a min-heap. Insert 1. Give the final array and the number of swaps.',a:'1 goes to index 9. Parent 4 (value 6) → swap. Now at 4; parent 1 (value 5) → swap. Now at 1; parent 0 (value 2) → swap.<br><b>[1, 2, 3, 9, 5, 4, 8, 10, 12, 6], 3 swaps.</b>'},
{t:'mc',pts:4,q:'Is [10, 20, 15, 30, 40, 50, 12] a valid min-heap?',o:['Yes','No: 15 at index 2 is bigger than its child 12','No: 20 at index 1 is bigger than 10','No: the tree is not complete'],a:1,e:'Index 2 has children at 5 (50) and 6 (12). 15 > 12 breaks min-heap order.'},
{t:'w',pts:6,q:'Max-heapify [3, 9, 2, 1, 4, 5]. Give the final array and the total number of swaps.',a:'n = 6, i = 2, 1, 0.<br>i=2: 2 vs child 5 → swap → [3, 9, 5, 1, 4, 2]<br>i=1: 9 vs 1, 4 → no swap<br>i=0: 3 vs 9, 5 → swap with 9 → [9, 3, 5, 1, 4, 2]; 3 vs 1, 4 → swap with 4 → [9, 4, 5, 1, 3, 2]<br><b>[9, 4, 5, 1, 3, 2], 3 swaps.</b>'},
{t:'mc',pts:4,q:'Insert 5, 9, 2, 7, 11, 4 into an empty max-heap. What is the in-order traversal of the resulting tree?',o:['5, 9, 7, 11, 2, 4','2, 4, 5, 7, 9, 11','11, 9, 4, 5, 7, 2','5, 9, 7, 11, 4, 2'],a:0,e:'Array: [5] → [9,5] → [9,5,2] → 7 swaps with 5 → [9,7,2,5] → 11 swaps with 7, then 9 → [11,9,2,5,7] → 4 swaps with 2 → [11,9,4,5,7,2]. Tree: 11 / (9: 5, 7) / (4: 2, _). In-order: 5, 9, 7, 11, 2, 4.'},
{t:'w',pts:6,q:'Your intern\'s counting sort fills B going forwards (i = 0 to n−1) while still using B[C[A[i]] − 1] and decrementing. Show on A = [(2,x), (0,y), (2,z)] that the result is not stable.',a:'Prefix sums: C[0] = 1, C[1] = 1, C[2] = 3. Forward: (2,x) → B[2], C[2] = 2; (0,y) → B[0]; (2,z) → B[1].<br>B = (0,y), (2,z), (2,x). In the input x came before z; in the output z comes first. Not stable.'},
{t:'mc',pts:4,q:'Any comparison sort on 5 items needs at least how many comparisons in the worst case?',o:['5','6','7','10'],a:2,e:'5! = 120; 2⁶ = 64 &lt; 120 ≤ 128 = 2⁷, so h ≥ 7.'},
{t:'mc',pts:4,q:'You must stably sort 2 million student records by exam score (integer 0–100). Best choice?',o:['HeapSort','Counting sort','QuickSort','Bucket sort with 1 bucket'],a:1,e:'k = 100 ≪ n, so counting sort is Θ(n) and stable. HeapSort and QuickSort are not stable; one bucket is just the inner sort.'}
]},
{name:'Part C · Trees (32 pts)',qs:[
{t:'w',pts:6,q:'Insert 50, 40, 30, 20, 10, 60, 70 into an empty 2-3 tree. Draw the final tree.',a:'30 splits [30,40,50] → root [40], leaves [30] [50]. 20 → [20,30]. 10 → [10,20,30] splits, 20 up → root [20,40], leaves [10] [30] [50]. 60 → [50,60]. 70 → [50,60,70] splits, 60 up → [20,40,60] splits, 40 up as new root.<br><b>Root [40]; left [20] with [10] [30]; right [60] with [50] [70]. Height 2.</b>'},
{t:'w',pts:8,q:'Delete 40 from the tree above. Draw the result, naming each fix.',a:'40 is internal. Successor = 50. Root becomes [50]; leaf [50] empties. It is the first child of [60]; right sibling [70] is minimal → <b>merge</b> [] + 60 + [70] = [60, 70]. Node [60] now has 0 keys. Its sibling [20] is minimal → <b>merge</b> [20] + 50 + [] = [20, 50] with children [10] [30] [60, 70]. Root is empty → removed.<br><b>Root [20, 50]; leaves [10], [30], [60, 70]. Height 1.</b>'},
{t:'w',pts:6,q:'Insert 15, 10, 8, 12, 20, 17, 25 into an empty BST. Give its height. Then delete 15 (successor rule) and give the pre-order.',a:'Tree: 15 / (10: 8, 12) / (20: 17, 25). Height 2.<br>Delete 15: successor = 17 (min of right subtree) → copy up, remove leaf 17.<br><b>Pre-order: 17, 10, 8, 12, 20, 25</b>'},
{t:'mc',pts:4,q:'For a B-tree of order 6: max keys per node; min keys in a non-root internal node; min keys in the root (if it is not a leaf)?',o:['5; 2; 1','6; 3; 1','5; 3; 2','5; 2; 2'],a:0,e:'Max keys m − 1 = 5. Min children ⌈6/2⌉ = 3 → 2 keys. Root needs ≥ 2 children → ≥ 1 key.'},
{t:'npf',pts:2,q:'A BST built by inserting n distinct keys has height O(log n).',a:1,e:'Some insertion orders give a balanced tree; sorted order gives height n − 1.'},
{t:'npf',pts:2,q:'A B-tree of order m holding n keys has height O(log n).',a:0,e:'B-trees are always balanced: height ≤ log_{⌈m/2⌉} n roughly.'},
{t:'npf',pts:2,q:'Splitting a leaf in a B-tree increases the tree\'s height.',a:1,e:'Only when the split cascades all the way up and splits the root.'},
{t:'npf',pts:2,q:'In a BST, the node holding the maximum key has no right child.',a:0,e:'A right child would hold a larger key.'}
]},
{name:'Part D · Short answer (12 pts)',qs:[
{t:'w',pts:6,q:'Why are B-trees preferred over balanced BSTs for data stored on disk?',a:'Reading a node from disk is far slower than working in memory, so the cost is the number of nodes visited. A B-tree node holds many keys (one disk block), making the tree much shallower: about log_m n levels instead of log₂ n. Fewer levels means fewer disk reads per search, insert or delete.'},
{t:'w',pts:6,q:'You have m integers with between 1 and k digits each (k ∈ Θ(m)), n digits in total, and digit counts are uniformly distributed. Sketch an O(n) sort.',a:'Bucket by digit count: put A[i] in bucket d_i − 1 (k buckets). Radix sort each bucket (stable counting sort per digit). Concatenate buckets in order: fewer digits means smaller, so the order is correct. Bucket i has ~m/k items of i+1 digits, so radix costs ~(i+1)(m/k); summing gives (m/k)·Σ(i+1), which is proportional to the total number of digits n, and m/k is constant since k ∈ Θ(m). Total O(n).'}
]}
]}

  <h2>Page 4</h2><div class="fig"><img src="cheat-p4.png" alt="Cheat sheet page 4" style="width:100%;max-width:900px"></div>
  <h2>LaTeX source</h2><pre id="tex-pre" style="max-height:520px"></pre></div>`;
}
function renderSheet(){
  return `<div class="wide"><div class="eyebrow">All nine boxes in one place</div><h1>Cheat sheet</h1>
  <p class="lede">Black and white on purpose, so it transfers cleanly to your LaTeX sheet and you can highlight by hand.</p>
  <p><button class="btn" id="copy-sheet">Copy all as plain text</button> <span class="score" id="copy-msg"></span></p>
  <div class="sheet" id="sheet-body">${TOPICS.map(t=>`<div class="cheat"><h3>${t.title}</h3>${t.cheat}</div>`).join('')}</div></div>`;
}

/* ---------- interactions ---------- */
let answered={};
document.addEventListener('click',e=>{
  const o=e.target.closest('.opt');
  if(o && !o.disabled){
    const qid=o.dataset.q, j=+o.dataset.j, c=+o.dataset.c;
    const box=document.getElementById(qid);
    box.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(+b.dataset.j===c) b.classList.add('right'); });
    if(j!==c) o.classList.add('wrong');
    const ans=box.querySelector('.ans'); ans.hidden=false;
    const v=ans.querySelector('.verdict'); v.textContent=j===c?'Correct.':'Not quite. Correct answer: '+LET[c]+'.'; v.className='verdict '+(j===c?'ok':'no');
    tally(qid,j===c);
    return;
  }
  const sh=e.target.closest('[data-show]');
  if(sh){ const box=document.getElementById(sh.dataset.show); const a=box.querySelector('.ans'); a.hidden=!a.hidden; sh.textContent=a.hidden?'Show answer':'Hide answer'; tally(sh.dataset.show,null); return; }
});
function tally(qid,ok){
  const topic=qid.split('-')[0];
  answered[topic]=answered[topic]||{};
  if(answered[topic][qid]===undefined) answered[topic][qid]=ok;
  const el=document.getElementById('score-'+topic);
  if(!el) return;
  const vals=Object.values(answered[topic]);
  const mc=vals.filter(v=>v!==null), right=mc.filter(v=>v).length;
  const tot=TOPICS.find(t=>t.id===topic).quiz.length;
  el.textContent=`Answered ${vals.length} of ${tot} · ${right}/${mc.length} auto-graded correct`;
}

/* timer */
let clk={left:3600,run:false,h:null};
function drawClock(){ const el=document.getElementById('clock'); if(!el) return; const m=Math.floor(clk.left/60), s=clk.left%60; el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; el.classList.toggle('low',clk.left<=300); }
function wireTest(){
  const st=document.getElementById('clk-start');
  st.onclick=()=>{ if(clk.run){ clearInterval(clk.h); clk.run=false; st.textContent='Resume'; } else { clk.run=true; st.textContent='Pause'; clk.h=setInterval(()=>{ if(clk.left>0){clk.left--; drawClock();} else { clearInterval(clk.h); clk.run=false; st.textContent='Time is up'; } },1000); } };
  document.getElementById('clk-reset').onclick=()=>{ clearInterval(clk.h); clk={left:3600,run:false,h:null}; st.textContent='Start'; drawClock(); };
  const rc=document.getElementById('reveal-confirm');
  document.getElementById('reveal-all').onclick=()=>{ rc.hidden=false; };
  document.getElementById('reveal-no').onclick=()=>{ rc.hidden=true; };
  document.getElementById('reveal-yes').onclick=()=>{
    rc.hidden=true;
    main.querySelectorAll('.q').forEach(box=>{
      box.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(+b.dataset.j===+b.dataset.c) b.classList.add('right'); });
      const a=box.querySelector('.ans'); a.hidden=false;
      const sb=box.querySelector('[data-show]'); if(sb) sb.textContent='Hide answer';
    });
  };
  drawClock();
}

/* heap lab */
function wireLab(){
  const lab=document.getElementById('heaplab'); if(!lab) return;
  const fig=document.getElementById('hl-fig'), log=document.getElementById('hl-log');
  let A=[];
  const read=()=>document.getElementById('hl-in').value.split(/[,\s]+/).filter(Boolean).map(Number).filter(x=>!isNaN(x));
  const better=(x,y)=>document.getElementById('hl-mode').value==='max'? x>y : x<y;
  function show(arr,sortedFrom){
    const f=document.createElement('div'); f.dataset.heap=(sortedFrom!==undefined?arr.slice(0,sortedFrom):arr).join(',');
    fig.innerHTML=''; if(!arr.length){fig.innerHTML='<div class="cap">(empty)</div>';return;}
    const tmp=document.createElement('div'); tmp.appendChild(f); hydrate(tmp); fig.innerHTML=f.innerHTML;
    if(sortedFrom!==undefined) fig.innerHTML+=`<div class="cap">Full array: [${arr.join(', ')}]</div>`;
  }
  function childIdx(a,n,i){ const l=2*i+1, r=2*i+2; if(l>=n) return n; if(r>=n) return l; return better(a[l],a[r])?l:r; }
  function sift(a,n,i,lines){ let m=childIdx(a,n,i); while(m<n && better(a[m],a[i])){ lines.push(`  swap ${a[i]} [${i}] ↔ ${a[m]} [${m}]`); [a[i],a[m]]=[a[m],a[i]]; i=m; m=childIdx(a,n,i);} }
  lab.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    const act=b.dataset.act, lines=[];
    if(act==='heapify'||act==='sort'){ A=read(); const n=A.length; lines.push(`Heapify [${A.join(', ')}], n=${n}, i from ${Math.floor(n/2)-1} down to 0`); for(let i=Math.floor(n/2)-1;i>=0;i--){ lines.push(`i=${i} (value ${A[i]})`); sift(A,n,i,lines); lines.push(`  → [${A.join(', ')}]`);} }
    if(act==='insert'){ const src=read(); A=[]; src.forEach(x=>{ A.push(x); let i=A.length-1; lines.push(`insert ${x} at [${i}]`); while(i>0){ const p=Math.floor((i-1)/2); if(better(A[i],A[p])){ lines.push(`  swap ${A[i]} [${i}] ↔ ${A[p]} [${p}]`); [A[i],A[p]]=[A[p],A[i]]; i=p;} else break; } lines.push(`  → [${A.join(', ')}]`); }); }
    if(act==='extract'){ if(!A.length){ A=read(); lines.push('(no heap yet, using the array as typed; heapify it first for a valid result)'); } if(A.length){ const t=A[0]; A[0]=A[A.length-1]; A.pop(); lines.push(`extract ${t}; move last item to root → [${A.join(', ')}]`); sift(A,A.length,0,lines); lines.push(`  → [${A.join(', ')}]`); document.getElementById('hl-in').value=A.join(', ');} }
    if(act==='sort'){ let n=A.length; lines.push('Sort down:'); for(let i=n-1;i>=1;i--){ [A[0],A[i]]=[A[i],A[0]]; lines.push(`i=${i}: swap root with [${i}] → [${A.slice(0,i).join(', ')} | ${A.slice(i).join(', ')}]`); n--; sift(A,n,0,lines); lines.push(`  → [${A.slice(0,i).join(', ')} | ${A.slice(i).join(', ')}]`);} }
    log.textContent=lines.join('\n'); show(A);
  });
  A=read(); show(A); log.textContent='Pick an action. Ties go to the right child, matching the lecture\'s MinChildIndex.';
}

function route(){
  const id=(location.hash||'#home').slice(1);
  rail.innerHTML=railHTML(id);
  clearInterval(clk.h); clk={left:3600,run:false,h:null};
  const ti=TOPICS.findIndex(t=>t.id===id), xi=TESTS.findIndex(t=>t.id===id);
  if(ti>=0){ main.innerHTML=renderTopic(TOPICS[ti],ti); answered[id]={}; }
  else if(xi>=0){ main.innerHTML=renderTest(TESTS[xi],xi); wireTest(); }
  else if(id==='latex'){ main.innerHTML=renderLatex();
    const tex=document.getElementById('texsrc').textContent.replace(/^\n/,'');
    document.getElementById('tex-pre').textContent=tex;
    document.getElementById('copy-tex').onclick=()=>{ const msg=document.getElementById('tex-msg');
      navigator.clipboard.writeText(tex).then(()=>msg.textContent='Copied. Paste it into main.tex on Overleaf.').catch(()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById('tex-pre')); const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r); msg.textContent='Selected the code below. Press Ctrl/Cmd+C to copy.'; }); }; }
  else if(id==='sheet'){ main.innerHTML=renderSheet();
    document.getElementById('copy-sheet').onclick=()=>{ const txt=document.getElementById('sheet-body').innerText; const msg=document.getElementById('copy-msg');
      navigator.clipboard.writeText(txt).then(()=>msg.textContent='Copied.').catch(()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById('sheet-body')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent='Selected. Press Ctrl/Cmd+C to copy.'; }); }; }
  else main.innerHTML=renderHome();
  hydrate(main); wireLab();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
